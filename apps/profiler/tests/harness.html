<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ACE UI Profiler -- panel tests</title>
<style>
  body { margin: 0; background: #222; color: #ddd; font: 12px monospace; }
  .absolutecenter { position: relative; width: 1600px; height: 900px; overflow: hidden; }
  #results { white-space: pre; }
</style>
<script src="../../../tests/lib/doubles.js"></script>
<script src="../../../tests/lib/lib.js"></script>
<link rel="stylesheet" type="text/css" href="../profiler/profiler.css">
<script>
(function () {
    var Widget = function () { return undefined; };

    Widget.prototype = Object.create(HTMLElement.prototype);
    Object.defineProperty(Widget.prototype, "mode", {
        configurable: true,
        get: function () { return this.dataset.mode; }
    });
    Widget.prototype.onBindingUpdate = function onBindingUpdate() { return 1; };
    window.__registry = { "ks-hudtyres": Widget };
    try {
        Object.defineProperty(window, "customElements", {
            configurable: true,
            value: { get: function (tag) { return window.__registry[tag]; } }
        });
    } catch (e) { window.__registryFailed = e.message; }
}());
</script>
<script src="../profiler/sampler.js"></script>
<script src="../profiler/profiler.js"></script>
</head>
<body>
<div class="absolutecenter" id="center"></div>
<script>
(function () {
    const H = window.__harness;
    const t = H.t, eq = H.eq, ok = H.ok;
    const P = ACEUIProfiler.internals;
    const S = ACEProfilerSampler;
    const clock = window.__clock;
    let frame = 1000;
    const nextFrame = function () { frame += 16; clock.step(frame); };
    const burn = function (ms) {
        const until = Date.now() + ms;

        while (Date.now() < until) { void 0; }
    };
    const rowTexts = function () {
        return Array.prototype.slice.call(root.querySelectorAll(".pr-row")).filter(function (r) {
            return !r.classList.contains("pr-hidden");
        }).map(function (r) { return r.querySelector(".pr-name").textContent; });
    };

    const widget = document.createElement("ks-hudtyres");

    document.getElementById("center").appendChild(widget);

    const root = document.createElement("div");
    root.id = "profiler";
    document.getElementById("center").appendChild(root);
    const state = P.attach(root);

    t("attach builds the panel once: graph, legend, table and controls", function () {
        eq(root.classList.contains("pr-hidden"), false, "open by default");
        ok(root.querySelector(".pr-canvas"), "a canvas for the graph");
        eq(root.querySelectorAll(".pr-row").length, P.ROWS, "a fixed pool of rows");
        eq(root.querySelectorAll(".pr-key").length, P.BANDS.length, "one legend key per category");
        ok(root.querySelector('[data-act="record"]'), "a record button");
        ok(state.ui && state.ui.loop.running, "the panel's own frame loop is running");
        ok(window.__log.some(function (l) { return l.indexOf("[profiler] panel attached") === 0; }), "logged");
    });

    /* A profiler that instruments the page the moment the HUD loads would be measuring
       every session whether asked or not, so recording is a deliberate act. */
    t("it does not instrument the page until asked", function () {
        eq(S.recording(), false, "not recording on attach");
        eq(S.wrapped(), false, "and the page is untouched");
    });

    t("record instruments the page, and the table names the apps it finds", function () {
        const button = root.querySelector('[data-act="record"]');
        let i;

        button.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        ok(S.recording(), "recording");
        ok(button.classList.contains("on"), "the button says so");

        const busy = ACEUIAppLoader.loop.start(function () { burn(2); }, "busymod");
        const quiet = ACEUIAppLoader.loop.start(function () { return 0; }, "quietmod");

        for (i = 0; i < 30; i += 1) { nextFrame(); }

        P.refreshTable(state);

        const names = rowTexts();

        ok(names.indexOf("busymod") >= 0, "the busy app is listed: " + names.join(", "));
        ok(names.indexOf("quietmod") >= 0, "so is the quiet one");
        ok(names.indexOf("busymod") < names.indexOf("quietmod"), "costliest first");
        ok(names.indexOf("profiler") >= 0, "and the profiler itself, which is only fair");
        ACEUIAppLoader.loop.stop(busy);
        ACEUIAppLoader.loop.stop(quiet);
    });

    t("the table reports cost per frame and a share of the frame, not one frame's reading", function () {
        const row = Array.prototype.slice.call(root.querySelectorAll(".pr-row")).filter(function (r) {
            return r.querySelector(".pr-name").textContent === "busymod";
        })[0];

        ok(row, "the busy app has a row");
        eq(row.querySelector(".pr-calls").textContent, "1.0", "one call per frame");
        ok(parseFloat(row.querySelector(".pr-ms").textContent) >= 1, "and its ms per frame: "
            + row.querySelector(".pr-ms").textContent);
        ok(row.querySelector(".pr-share").textContent.indexOf("%") > 0, "share is a percentage");
        ok(row.querySelector(".pr-bar").style.transform.indexOf("scaleX(") === 0, "the bar is scaled, not resized");
    });

    t("the graph writes one column per frame and sweeps round rather than redrawing", function () {
        const before = state.sweep;

        nextFrame();
        nextFrame();
        ok(state.sweep !== before, "the sweep moved");
        ok(state.drawn >= 2, "columns drawn: " + state.drawn);
        ok(state.sweep < P.GRAPH_W, "and it stays inside the canvas");
    });

    t("clear empties the recording and the graph", function () {
        root.querySelector('[data-act="clear"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
        eq(S.frames().length, 0, "frames cleared");
        eq(state.sweep, 0, "sweep back to the start");
        eq(rowTexts().length, 0, "and no rows");
    });

    /* Closing a panel used to hide its root and leave the app switched on in the drawer,
       which is the one place in the UI you can get an app back from: the profiler was then
       unreachable except by its hotkey. Closing is switching off, and the key that brings it
       back is held by the loader, because an app that is off is not running to hold it. */
    t("pausing stops recording; closing switches the app off, where the drawer can see it", function () {
        const drawer = ACEUIAppLoader.drawer;

        root.querySelector('[data-act="record"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
        eq(S.recording(), false, "paused");

        root.querySelector('[data-act="close"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
        eq(drawer.isVisible("profiler"), false, "off in the drawer, which is where you get it back");
        eq(root.style.display, "none", "and off the screen");

        const key = new KeyboardEvent("keydown", { code: ACEUIProfiler.toggleKey(), bubbles: true });

        window.dispatchEvent(key);
        eq(drawer.isVisible("profiler"), true, "the loader's own hotkey brings a closed app back");
        eq(root.style.display, "", "and it is on screen again");
    });

    /*
     * Unity lets you step frame by frame because its clock resolves microseconds. Here a
     * single ordinary frame reads 0 or 1 ms for anything small, so stepping would mostly
     * show zeroes. What this clock *can* see is a spike: 40 ms of work in a frame is 40 ms
     * however coarsely you measure it. Hence a worst-frame view rather than a scrubber.
     */
    t("WORST shows what was in the slowest frame, which is what a 1 ms clock can support", function () {
        const button = root.querySelector('[data-act="mode"][data-value="worst"]');
        let i = 0;

        root.querySelector('[data-act="record"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));

        const spiky = ACEUIAppLoader.loop.start(function () {
            i += 1;

            if (i === 5) { burn(20); }
        }, "spikymod");

        for (i = 0; i < 20; i += 1) { nextFrame(); }

        button.dispatchEvent(new MouseEvent("click", { bubbles: true }));

        const worst = P.worstFrame();
        const names = rowTexts();

        ok(button.classList.contains("on"), "the button shows the mode");
        ok(worst && worst.wallMs > 0, "a worst frame was found");
        ok(root.querySelector(".pr-stat").textContent.indexOf("worst frame") === 0,
            "the header says so: " + root.querySelector(".pr-stat").textContent);
        ok(names.indexOf("spikymod") >= 0, "the spike's owner is in the list: " + names.join(", "));
        ok(names.some(function (n) { return n.indexOf("engine") === 0; }),
            "and so is the engine's share of that frame");

        root.querySelector('[data-act="mode"][data-value="window"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
        ok(!button.classList.contains("on"), "picking another view releases this one");
        ACEUIAppLoader.loop.stop(spiky);
    });

    t("LOG puts the table in the game log, where this project does its debugging", function () {
        const before = window.__log.length;

        root.querySelector('[data-act="log"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));

        const added = window.__log.slice(before);

        ok(added.length >= 3, "it logged something: " + added.length + " lines");
        ok(added[0].indexOf("[profiler] ---- window") === 0, "a header naming the view: " + added[0]);
        ok(added[added.length - 1].indexOf("[profiler] ---- end") === 0, "and an end marker");
        ok(added.some(function (l) { return l.indexOf("calls/f") > 0; }), "with the columns on each row");
    });

    t("stock widgets are wrapped only when the setting asks for it", function () {
        root.querySelector('[data-act="record"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
        eq(S.recording(), false, "stopped recording first");

        ACEUIAppLoader.settings.set("profiler", "widgets", true);
        root.querySelector('[data-act="record"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
        ok(S.widgets().length >= 1, "the stock widget's methods were wrapped: " + S.widgets().join(", "));
        ok(S.widgets()[0].indexOf("ks-hudtyres.") === 0, "by tag and method");

        root.querySelector('[data-act="record"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
        ACEUIAppLoader.settings.set("profiler", "widgets", false);
    });

    /* A frame's wall time is the gap between animation-frame timestamps, so a spike is a
       large gap -- not a busy loop, which the harness's fixed clock would not notice. */
    t("a frame over the threshold stops the recording and shows that frame", function () {
        let i;

        ACEUIAppLoader.settings.set("profiler", "spikeMs", 30);
        root.querySelector('[data-act="record"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
        ok(S.recording(), "recording");

        const spiky = ACEUIAppLoader.loop.start(function () { return 0; }, "spiker");

        for (i = 0; i < 4; i += 1) { nextFrame(); }

        frame += 50;                       // one frame that took 50 ms
        clock.step(frame);
        nextFrame();
        nextFrame();

        eq(S.recording(), false, "the spike stopped the recording");
        eq(state.mode, P.MODE_WORST, "and switched to the frame it happened in");
        ok(window.__log.some(function (l) { return l.indexOf("[profiler] frame of") === 0; }), "and said so");
        ok(rowTexts().length > 0, "with that frame's rows on show");

        ACEUIAppLoader.loop.stop(spiky);
        ACEUIAppLoader.settings.set("profiler", "spikeMs", 0);
        P.setMode(state, P.MODE_WINDOW);
    });

    t("the table has a layout column, which is this engine's GC Alloc", function () {
        const head = root.querySelector(".pr-head");

        ok(head.textContent.indexOf("Layout") >= 0, "the column is labelled: " + head.textContent);
        ok(root.querySelector(".pr-row .pr-layout"), "and every row has the cell");
    });

    t("TREE shows each app with what it called inside it, indented", function () {
        let i;

        root.querySelector('[data-act="record"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));

        const deep = ACEUIAppLoader.loop.start(function () {
            ACEUIAppLoader.section("inner work", function () { burn(1); });
        }, "deepmod");

        for (i = 0; i < 12; i += 1) { nextFrame(); }

        root.querySelector('[data-act="mode"][data-value="tree"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));

        const names = rowTexts();
        const parent = names.filter(function (n) { return n === "deepmod"; })[0];
        const rows = Array.prototype.slice.call(root.querySelectorAll(".pr-row")).filter(function (r) {
            return !r.classList.contains("pr-hidden");
        });
        const childRow = rows.filter(function (r) {
            return r.querySelector(".pr-name").textContent === "inner work";
        })[0];

        ok(root.querySelector('[data-act="mode"][data-value="tree"]').classList.contains("on"),
            "the picker shows which view is on");
        ok(root.querySelector(".pr-stat").textContent.indexOf("call tree") === 0,
            "the header says what is on screen: " + root.querySelector(".pr-stat").textContent);
        ok(parent, "the app is listed: " + names.join(" | "));
        ok(childRow, "with the section it named inside it: " + names.join(" | "));
        eq(childRow.getAttribute("data-depth"), "1", "marked a level deep, which is what indents it");
        eq(rows[0].getAttribute("data-depth"), "0", "a root row is not indented");
        ok(names.indexOf("deepmod") < names.indexOf("inner work"), "and the parent comes first");

        root.querySelector('[data-act="mode"][data-value="window"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
        ACEUIAppLoader.loop.stop(deep);
        root.querySelector('[data-act="record"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
    });

    /*
     * On a real HUD the engine's slice is most of every frame, so the graph is a grey wall
     * with the scripts squashed into the bottom eighth. Switching a band off is what turns
     * it back into a picture of what the apps did.
     */
    t("a legend entry switches its band off, in the graph and the table together", function () {
        const engine = root.querySelector('.pr-key[data-value="other"]');
        let i;

        root.querySelector('[data-act="record"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));

        const busy = ACEUIAppLoader.loop.start(function () { burn(1); }, "bandmod");

        for (i = 0; i < 20; i += 1) { nextFrame(); }

        P.setMode(state, P.MODE_WORST);
        ok(rowTexts().some(function (n) { return n.indexOf("engine") === 0; }), "the engine row is there");

        const fullWas = state.fullMs;

        engine.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        eq(state.bands.other, false, "the band is off");
        // the point of switching the engine off is to see what is left, so the graph has to
        // range on what it is drawing rather than on the frame time that is no longer in it
        ok(state.fullMs < fullWas, "and the graph rescaled to what is left: "
            + fullWas + " -> " + state.fullMs);
        ok(engine.classList.contains("off"), "and the legend says so");
        ok(!rowTexts().some(function (n) { return n.indexOf("engine") === 0; }),
            "the table dropped it too: " + rowTexts().join(" | "));
        eq(ACEUIAppLoader.app("profiler").recall("bands", {}).other, false, "and the choice is remembered");

        engine.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        eq(state.bands.other, true, "clicking again brings it back");
        ACEUIAppLoader.loop.stop(busy);
        P.setMode(state, P.MODE_WINDOW);
        root.querySelector('[data-act="record"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
    });

    /* Total is the branch and self is the row's own hands; a row that is slow because of
       what it calls should say 2 ms total and almost no self, with the cost underneath it. */
    t("the table shows total and self, which is how a hierarchy tells you where to look", function () {
        let i;

        root.querySelector('[data-act="record"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));

        const outer = ACEUIAppLoader.loop.start(function () {
            ACEUIAppLoader.section("inner", function () { burn(2); });
        }, "selfmod");

        for (i = 0; i < 24; i += 1) { nextFrame(); }

        P.setMode(state, P.MODE_TREE);

        const rows = P.reportFor(P.MODE_TREE).rows.filter(function (row) {
            return row.name === "selfmod" || row.name === "inner";
        });
        const parent = rows.filter(function (row) { return row.name === "selfmod"; })[0];
        const child = rows.filter(function (row) { return row.name === "inner"; })[0];

        ok(parent && child, "the app and the section it ran");
        ok(parent.msPerFrame >= child.msPerFrame, "the parent's total includes the child's");
        ok(parent.selfPerFrame < parent.msPerFrame,
            "but its self time does not: " + parent.selfPerFrame + " of " + parent.msPerFrame);

        const cell = root.querySelector(".pr-row:not(.pr-hidden) .pr-self");

        ok(cell && cell.textContent.length, "and the column is drawn: " + (cell && cell.textContent));
        ACEUIAppLoader.loop.stop(outer);
        P.setMode(state, P.MODE_WINDOW);
        root.querySelector('[data-act="record"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
    });

    /* "Which is worst" depends on the question: the heaviest branch, the heaviest function,
       the thing called four hundred times. A header click is how you ask a different one. */
    t("a column header sorts the table, and the same header again turns it round", function () {
        const header = root.querySelector('.pr-head [data-sort="ms"]');
        let i;

        root.querySelector('[data-act="record"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));

        const busy = ACEUIAppLoader.loop.start(function () { burn(2); }, "sortbusy");
        const quiet = ACEUIAppLoader.loop.start(function () { return 0; }, "sortquiet");

        for (i = 0; i < 24; i += 1) { nextFrame(); }

        P.refreshTable(state);

        const down = rowTexts();

        ok(down.indexOf("sortbusy") < down.indexOf("sortquiet"),
            "costliest first by default: " + down.join(" | "));
        ok(header.classList.contains("sorted"), "the header says which column that is");
        ok(!header.classList.contains("asc"), "pointing down");

        header.dispatchEvent(new MouseEvent("click", { bubbles: true }));

        const up = rowTexts();

        eq(state.sort.dir, 1, "clicking the sorted column turns it round");
        ok(header.classList.contains("asc"), "and the arrow with it");
        ok(up.indexOf("sortbusy") > up.indexOf("sortquiet"), "cheapest first: " + up.join(" | "));

        root.querySelector('.pr-head [data-sort="calls"]')
            .dispatchEvent(new MouseEvent("click", { bubbles: true }));
        eq(state.sort.key, "calls", "another column takes over");
        eq(state.sort.dir, -1, "biggest first, as a new column should start");
        ok(!header.classList.contains("sorted"), "and the old one stops claiming it");

        header.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        ACEUIAppLoader.loop.stop(busy);
        ACEUIAppLoader.loop.stop(quiet);
        root.querySelector('[data-act="record"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
    });

    /* A fixed 33 ms full scale drew this HUD's 17 ms frames at half height for ever and
       clipped anything worse. The scale steps instead, and says which step it is on. */
    t("the graph ranges itself to what the window has been doing", function () {
        let i;

        P.clearAll(state);
        eq(state.fullKey, "17", "cleared, it goes back to one frame of the page as full height");

        root.querySelector('[data-act="record"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));

        const heavy = ACEUIAppLoader.loop.start(function () { burn(22); }, "scalemod");

        for (i = 0; i < 10; i += 1) { nextFrame(); }

        ok(state.fullMs > 17.1, "a heavy window opens the scale up: " + state.fullMs);
        eq(state.graphEl.getAttribute("data-full"), state.fullKey,
            "the graph carries it, so the stylesheet can place the tick labels");
        ok(state.scaleTop.textContent.indexOf(String(state.fullMs)) === 0,
            "and the top of the graph says what it now means: " + state.scaleTop.textContent);

        ACEUIAppLoader.loop.stop(heavy);
        root.querySelector('[data-act="record"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
    });

    /* The public surface: a snippet in the dev console should be able to do what the buttons
       do, through the same code, without reaching into the panel's insides. */
    t("the panel handle drives the panel: the same verbs the buttons use", function () {
        const panel = ACEUIProfiler.panel();

        ok(panel, "there is a handle once the panel is mounted");
        eq(panel.state, state, "for the panel that is on screen");

        eq(panel.record(true), true, "record");
        eq(S.recording(), true, "really recording");
        eq(panel.record(false), false, "and off again");

        eq(panel.mode("tree"), "tree", "mode");
        eq(state.mode, "tree", "really switched");
        panel.mode("window");

        eq(panel.band("other", false), false, "band off");
        eq(state.bands.other, false, "really off");
        panel.band("other", true);

        eq(panel.sort("self").key, "self", "sort");
        eq(state.sort.key, "self", "really sorted");
        panel.sort("ms");

        ok(panel.report().rows, "report reads the numbers back");
        eq(typeof panel.scale(), "number", "scale answers with the size it is");
        eq(panel.open(true), true, "and open shows it");
        eq(root.classList.contains("pr-hidden"), false, "really on screen");
    });

    t("the panel scales through the loader's own scale, not its own copy of it", function () {
        const was = state.scaler.value();

        root.querySelector('[data-act="larger"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
        ok(state.scaler.value() > was, "the + button grew it: " + state.scaler.value());
        eq(root.style.fontSize, state.scaler.value() + "rem", "which is a font-size on the root");
        eq(ACEUIAppLoader.settings.get("profiler", "scale"), state.scaler.value(),
            "and the same value the settings window shows");
        root.querySelector('[data-act="smaller"]').dispatchEvent(new MouseEvent("click", { bubbles: true }));
        eq(state.scaler.value(), was, "and back down again");
    });

    t("the other apps can reach the panel by name while it is attached", function () {
        const handle = ACEUIAppLoader.shared.get("profiler");

        eq(handle, ACEUIProfiler.panel(), "the registered surface is the panel's own handle");
        eq(handle.record(true), true, "so an app can start a recording without knowing our global");
        handle.record(false);
    });

    t("detach stops the loop and leaves the page uninstrumented", function () {
        const cancelled = clock.cancelled;

        P.detach(state);
        eq(ACEUIAppLoader.shared.get("profiler"), null, "and it stops answering: the handle was this panel's");
        eq(clock.cancelled, cancelled + 1, "the frame was cancelled");
        eq(state.ui.loop.running, false, "loop stopped");
        eq(S.wrapped(), false, "and nothing of ours is left wrapped around the page");
    });

    H.finish();
}());
</script>
</body>
</html>
