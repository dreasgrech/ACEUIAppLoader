<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ACE UI Capabilities Probe tests</title>
<style>
  body { margin: 0; background: #222; color: #ddd; font: 12px monospace; }
  .absolutecenter { position: relative; width: 1600px; height: 900px; overflow: hidden; }
  #results { white-space: pre; }
</style>
<!-- shared test doubles (fake frame clock, in-memory localStorage, console capture) and the library, from the loader repo -->
<script src="../../../tests/lib/doubles.js"></script>
<script src="../../../tests/lib/lib.js"></script>
<link rel="stylesheet" type="text/css" href="../capabilities/capabilities.css">
<script>window.ModelCurrentCar = { has_focused_car: true, gas_percent: 0.5 };</script>
<script src="../capabilities/capabilities.js"></script>
</head>
<body>
<div class="absolutecenter" id="center"></div>
<script>
(function () {
    const H = window.__harness;
    const t = H.t, eq = H.eq, ok = H.ok;

    const rowIndex = function (name) {
        let found = -1;
        CapabilitiesProbe.CHECKS.forEach(function (c, i) { if (c.name === name) { found = i; } });
        return found;
    };

    const root = document.createElement("div");
    root.id = "capabilities";
    document.getElementById("center").appendChild(root);
    const state = CapabilitiesProbe.attach(root);

    t("attach builds the panel once, hidden until placed, and logs with the app's prefix", function () {
        ok(root.classList.contains("ace-capabilities"), "root class");
        ok(root.querySelector(".cp-body"), "body built");
        eq(root.querySelector(".cp-title").textContent, "capabilities", "title falls back to the name outside the game");
        eq(root.style.visibility, "hidden", "hidden until positioned");
        ok(state.ui.loop.running, "loop running");
        ok(window.__log.some(function (l) { return l.indexOf("[capabilities] attached") === 0; }), "prefixed log");
    });

    t("every check renders a colour-coded row and the summary counts them", function () {
        eq(state.rows.length, CapabilitiesProbe.CHECKS.length, "one row per check");
        const summary = root.querySelector(".cp-summary").textContent;
        ok(summary.indexOf("yes") >= 0, "summary names a yes count");
        ok(state.rows[rowIndex("Promise")].dot.className.indexOf("cp-yes") >= 0, "Promise detected present");
        ok(state.rows[rowIndex("engine audio bridge")].dot.className.indexOf("cp-no") >= 0, "engine bridge absent outside the game");
    });

    /* Four checks are asynchronous and slow on purpose, so a re-run leaves the previous
       run's probes in flight; their callbacks would write an old answer into a fresh row
       and decrement a pending count that is no longer theirs. */
    t("a re-run starts a new generation, so probes still in flight cannot write into it", function () {
        const before = state.run;

        CapabilitiesProbe.runAll(state);
        eq(state.run, before + 1, "the run is numbered");
        eq(state.results.length, CapabilitiesProbe.CHECKS.length, "and every row was answered again");
        ok(state.results.every(function (r) { return r && r.name; }), "each result knows its check");
    });

    t("while attached it answers other apps, and stops answering when it is not", function () {
        const probe = ACEUIAppLoader.shared.get("capabilities");
        ok(probe, "registered while attached");
        eq(probe.checks().length, CapabilitiesProbe.CHECKS.length, "it can say what it probes");
        eq(probe.status("Promise"), "yes", "and what it found");
        eq(probe.status("not a check"), null, "a question it has no answer to is null, not a guess");
        eq(probe.results().length, CapabilitiesProbe.CHECKS.length);
        probe.results().pop();
        eq(ACEUIAppLoader.shared.get("capabilities").results().length, CapabilitiesProbe.CHECKS.length, "a copy, not the live list");
    });

    /* The pointer rows are counters the window listeners fill; a re-run reads them. Outside the
       game the events are synthetic, but the plumbing from listener to row is the same. */
    t("pointer & screen: the counters fill from window and document events and a re-run reads them", function () {
        const P = CapabilitiesProbe.pointer;
        const result = function (name) { return state.results[rowIndex(name)]; };
        const W = window.innerWidth;

        eq(P.moves, 0, "nothing counted before any event");
        window.dispatchEvent(new MouseEvent("mousemove", { clientX: 40, clientY: 30, bubbles: true }));
        window.dispatchEvent(new MouseEvent("mousemove", { clientX: W - 1, clientY: 30, bubbles: true }));
        window.dispatchEvent(new Event("blur"));
        window.dispatchEvent(new Event("focus"));
        document.dispatchEvent(new MouseEvent("mouseout", { relatedTarget: null, bubbles: true }));
        window.dispatchEvent(new MouseEvent("mousedown", { clientX: 40, clientY: 30, buttons: 1, bubbles: true }));
        CapabilitiesProbe.runAll(state);
        eq(result("right button").status, "warn", "a left press only: no right button yet"); ok(result("right button").detail.indexOf("e.button seen: 0;") > 0, result("right button").detail);
        window.dispatchEvent(new MouseEvent("contextmenu", { clientX: 40, clientY: 30, button: 2, bubbles: true }));
        CapabilitiesProbe.runAll(state);
        eq(result("right button").status, "warn", "a contextmenu alone is not a right press");
        window.dispatchEvent(new MouseEvent("mousedown", { clientX: 40, clientY: 30, button: 2, buttons: 2, bubbles: true, cancelable: true }));
        window.dispatchEvent(new MouseEvent("mouseup", { clientX: 40, clientY: 30, button: 2, bubbles: true }));
        window.dispatchEvent(new MouseEvent("click", { clientX: 40, clientY: 30, button: 2, bubbles: true }));
        window.dispatchEvent(new MouseEvent("mouseup", { clientX: 40, clientY: 30, button: 0, bubbles: true }));
        window.dispatchEvent(new MouseEvent("mousedown", { clientX: 40, clientY: 30, buttons: 1, bubbles: true }));
        eq(P.rightDowns, 1); eq(P.rightUps, 1, "only the right button's release"); eq(P.rightClicks, 1); eq(P.contextMenus, 1); eq(P.buttonsSeen.join(","), "0,2");
        eq(P.moves, 2); eq(P.maxX, W - 1); eq(P.edgeHits, 1, "the last column counts as the edge");
        eq(P.jumps, 1, "40 to the far edge in one sample is a jump, not a movement"); ok(P.lastJump.indexOf("40,30 to ") === 0, P.lastJump);
        eq(P.blurs, 1); eq(P.focuses, 1); eq(P.docOuts, 1, "a mouseout with no relatedTarget is the pointer leaving the page");
        eq(P.lastButtons, 1);

        CapabilitiesProbe.runAll(state);
        eq(result("viewport").detail.indexOf(W + "x" + window.innerHeight), 0, "the viewport row says the size");
        ok(result("px per rem").detail.indexOf("px per rem") > 0, "px per rem is reported: " + result("px per rem").detail);
        eq(result("mousemove").status, "yes"); ok(result("mousemove").detail.indexOf("2 moves") === 0, result("mousemove").detail);
        eq(result("pointer at the right edge").status, "yes");
        eq(result("pointer jumps").status, "warn"); ok(result("pointer jumps").detail.indexOf("1 jump(s)") === 0, result("pointer jumps").detail);
        eq(result("window blur / focus").status, "yes"); ok(result("window blur / focus").detail.indexOf("1 blur, 1 focus") === 0);
        eq(result("pointer leaving the document").status, "yes");
        eq(result("mouse buttons field").status, "yes"); ok(result("mouse buttons field").detail.indexOf("e.buttons = 1") === 0);
        eq(result("right button").status, "yes"); eq(result("right button").detail, "1 right-button press(es), cancelable true. e.button seen: 0, 2; right releases 1, left releases reported as another button 0, right clicks 1, clicks after a middle or right release 1, right clicks after their release's task 0, contextmenu events 1");
        // an engine with no e.button field: named, and not asked for another right-click
        const kept = { seen: P.buttonsSeen, downs: P.rightDowns, ups: P.rightUps };
        P.buttonsSeen = [null]; P.rightDowns = 0; P.rightUps = 0;
        CapabilitiesProbe.runAll(state);
        eq(result("right button").status, "no"); ok(result("right button").detail.indexOf("e.button seen: none (no field);") > 0, result("right button").detail);
        P.buttonsSeen = [null, 0]; CapabilitiesProbe.runAll(state);
        eq(result("right button").status, "warn"); ok(result("right button").detail.indexOf("e.button seen: none (no field), 0;") > 0, result("right button").detail);
        // a real press with no button field, through the listener
        P.buttonsSeen = []; P.rightDowns = 0;
        const nofield = new MouseEvent("mousedown", { bubbles: true }); Object.defineProperty(nofield, "button", { value: undefined });
        window.dispatchEvent(nofield);
        eq(JSON.stringify(P.buttonsSeen), "[null]", "a press without e.button is recorded as null");
        CapabilitiesProbe.runAll(state); eq(result("right button").status, "no", "and named NO");
        window.dispatchEvent(new MouseEvent("mousedown", { button: 0, buttons: 2, bubbles: true }));
        eq(P.rightDowns, 0, "e.buttons is not e.button");
        const clicks = P.rightClicks; window.dispatchEvent(new MouseEvent("click", { button: 0, bubbles: true }));
        eq(P.rightClicks, clicks, "a left click is not a right click");
        window.dispatchEvent(new MouseEvent("mousedown", { button: 2, bubbles: true, cancelable: false }));
        eq(P.rightCancelable, false, "a non-cancelable right press is recorded as such");
        const ups = P.rightUps; P.rightDowns = 1; P.rightUps = 0; CapabilitiesProbe.runAll(state);
        eq(result("right button").status, "warn", "right presses but no release reporting button 2"); ok(result("right button").detail.indexOf("releases cannot be told apart") > 0, result("right button").detail);
        P.rightUps = ups;
        // a left press whose release says it was the right button: every left drag in the loader would never end
        const other = P.leftUpsAsOther;
        P.held = [];
        window.dispatchEvent(new MouseEvent("mousedown", { button: 0, bubbles: true })); window.dispatchEvent(new MouseEvent("mouseup", { button: 2, bubbles: true }));
        eq(P.leftUpsAsOther, other + 1, "counted"); CapabilitiesProbe.runAll(state);
        eq(result("right button").status, "warn", "a left release reported as the right"); ok(result("right button").detail.indexOf("left drags may not end") > 0, result("right button").detail);
        P.leftUpsAsOther = other;
        const dn = function (b) { window.dispatchEvent(new MouseEvent("mousedown", { button: b, bubbles: true })); };
        const upb = function (b) { window.dispatchEvent(new MouseEvent("mouseup", { button: b, bubbles: true })); };
        dn(2); dn(0); upb(2); upb(0);
        eq(P.leftUpsAsOther, other, "a chord released right first is two right releases, not a misreport"); eq(P.held.length, 0);
        upb(2);
        eq(P.leftUpsAsOther, other, "a right release of a press made before the probe attached is not either");
        const side = new MouseEvent("mousedown", { bubbles: true }); Object.defineProperty(side, "button", { value: undefined }); window.dispatchEvent(side); upb(2);
        eq(P.leftUpsAsOther, other + 1, "a press with no field is the loader's left: released as the right, it counts");
        dn(3); upb(1);
        eq(P.leftUpsAsOther, other + 2, "so is a side button, released as the middle");
        dn(0); upb(0); upb(2);
        eq(P.leftUpsAsOther, other + 2, "a stray right release after a finished left click does not");
        dn(0); const none = new MouseEvent("mouseup", { bubbles: true }); Object.defineProperty(none, "button", { value: undefined }); window.dispatchEvent(none);
        eq(P.leftUpsAsOther, other + 2, "a release with no field ends a left drag in the loader: not counted"); eq(P.held.length, 0, "and lets everything go");
        dn(1); upb(2);
        eq(P.leftUpsAsOther, other + 2, "a middle press drags nothing: its release is not counted");
        P.held = [];
        dn(0); dn(0); upb(2); upb(2);
        eq(P.leftUpsAsOther, other + 3, "a press repeated without a release is held once: one misreport, not two");
        P.held = [];
        dn(0); dn(3); upb(2); upb(2);
        eq(P.leftUpsAsOther, other + 5, "a misreported release lets only its own press go: the other held left counts too");
        P.held = [];
        dn(2); dn(0); upb(2); upb(2);
        eq(P.leftUpsAsOther, other + 6, "the right let go as the right; then the left, released as the right, counts");
        P.held = [];
        dn(1); dn(0); upb(2); upb(1);
        eq(P.leftUpsAsOther, other + 7, "a left released as the right while the middle is held counts, and the middle's own release is its own");
        const after = P.clicksAfterRight;
        dn(2); upb(2); window.dispatchEvent(new MouseEvent("click", { button: 0, bubbles: true }));
        eq(P.clicksAfterRight, after + 1, "a click in a right release's task counts whatever button it reports");
        window.dispatchEvent(new MouseEvent("click", { button: 0, bubbles: true }));
        eq(P.clicksAfterRight, after + 1, "one per release");
        const realTimeout = window.setTimeout, timers = [];
        window.setTimeout = function (fn, ms) { timers.push([fn, ms || 0]); return 0; };
        try { dn(2); upb(2); } finally { window.setTimeout = realTimeout; }
        eq(timers.length > 0 && timers.every(function (x) { return x[1] === 0; }), true, "the release's window closes at the end of its task");
        timers.forEach(function (x) { x[0](); });
        const was = P.clicksAfterRight;
        window.dispatchEvent(new MouseEvent("click", { button: 0, bubbles: true }));
        eq(P.clicksAfterRight, was, "a click after the release's task (a browser sends none for the right) is not the release's");
        window.dispatchEvent(new MouseEvent("mousedown", { button: 0, bubbles: true })); window.dispatchEvent(new MouseEvent("mouseup", { button: 0, bubbles: true }));
        window.dispatchEvent(new MouseEvent("click", { button: 0, bubbles: true }));
        eq(P.clicksAfterRight, was, "nor is a left click's, in its own release's task");
        const rightClicks = P.rightClicks;
        window.dispatchEvent(new MouseEvent("click", { button: 2, bubbles: true }));
        eq(P.clicksAfterRight, was, "nor a click reporting the right button with no right release before it");
        CapabilitiesProbe.runAll(state);
        eq(result("right button").status, "warn", "a right-button click outside its release's task: the loader's rule cannot catch it"); ok(result("right button").detail.indexOf("came after its release's task") > 0, result("right button").detail);
        P.rightClicks = rightClicks; P.lateRightClicks = 0;
        // the releases the loader's click rule arms on: a middle one, and a right one misreported as the left (no left press held)
        const before = P.clicksAfterRight, late = P.lateRightClicks;
        P.held = [];
        dn(1); upb(1); window.dispatchEvent(new MouseEvent("click", { button: 1, bubbles: true }));
        eq(P.clicksAfterRight, before + 1, "a click in a middle release's task is that release's");
        dn(2); upb(0); window.dispatchEvent(new MouseEvent("click", { button: 2, bubbles: true }));
        eq(P.clicksAfterRight, before + 2, "and in the task of a right release misreported as the left");
        eq(P.lateRightClicks, late, "so its right click is not a late one");
        P.rightClicks = rightClicks; P.lateRightClicks = 0; P.held = [];
        // the loader lets its left press go on a blur: so does the probe's model, so a misreported right release after it arms
        dn(0); window.dispatchEvent(new Event("blur"));
        eq(P.held.length, 0, "a blur lets the held left press go");
        const r = new MouseEvent("mouseup", { button: 0, buttons: 1, bubbles: true }); window.dispatchEvent(r);
        eq(P.lastUpButtons, 1, "e.buttons on a release is recorded");
        P.held = [];
        window.dispatchEvent(new MouseEvent("mousedown", { button: 0, bubbles: true })); window.dispatchEvent(new MouseEvent("mouseup", { button: 0, bubbles: true }));
        eq(P.leftUpsAsOther, other + 7, "a left release reported as the left is not");
        P.leftUpsAsOther = other; P.held = [];
        P.buttonsSeen = kept.seen; P.rightDowns = kept.downs; P.rightUps = kept.ups; CapabilitiesProbe.runAll(state);
        eq(result("cursor hidden by the HUD").status, "no", "no HUD here, so the cursor is shown");
        ok(P.fixture && P.fixture.strip.style.pointerEvents === "none" && P.fixture.strip.parentNode === document.body, "the pointer-events fixture is on the body with the inline form under test");
        eq(result("inline pointer-events: none").status, "yes", "a browser lets the hit through: " + result("inline pointer-events: none").detail);
    });

    t("a count and a press still held at detach, for the next attach to start afresh from", function () {
        const P = CapabilitiesProbe.pointer;
        window.dispatchEvent(new MouseEvent("mousedown", { button: 0, bubbles: true })); window.dispatchEvent(new MouseEvent("mouseup", { button: 2, bubbles: true }));
        window.dispatchEvent(new MouseEvent("mousedown", { button: 0, bubbles: true }));
        ok(P.leftUpsAsOther > 0, "a count"); eq(P.held.length, 1, "a press held");
    });

    t("pointer & screen: dragend drops the held left; a blur keeps a held right; a side button held makes a left release no misreport; the last release's e.buttons is shown; a late right click is left for the reset", function () {
        const P = CapabilitiesProbe.pointer;
        const dn = function (b) { window.dispatchEvent(new MouseEvent("mousedown", { button: b, bubbles: true })); };
        const upb = function (b, buttons) { window.dispatchEvent(new MouseEvent("mouseup", { button: b, buttons: buttons || 0, bubbles: true })); };
        const clk = function (b) { window.dispatchEvent(new MouseEvent("click", { button: b, bubbles: true })); };
        const keptHeld = P.held.slice(), keptOther = P.leftUpsAsOther;
        P.held = [];
        dn(0); window.dispatchEvent(new Event("dragend"));
        eq(P.held.length, 0, "a dragend lets the held left press go, as the loader's letGo does");
        P.held = [];
        const ups = P.rightUps;
        dn(2); window.dispatchEvent(new Event("blur")); upb(2);
        eq(P.rightUps, ups + 1, "a right press held across a blur is still matched by its release");
        P.held = [];
        clk(0);
        const after = P.clicksAfterRight;
        dn(3); upb(0); clk(0);
        eq(P.clicksAfterRight, after, "a left release while a side button (the loader's left) is held arms nothing, as in the loader");
        P.held = [];
        const bare = new MouseEvent("mouseup", { button: 0, bubbles: true }); Object.defineProperty(bare, "buttons", { value: undefined }); window.dispatchEvent(bare);
        eq(P.lastUpButtons, null, "a release with no e.buttons is recorded as none");
        dn(0); upb(0, 0);
        CapabilitiesProbe.runAll(state);
        const row = state.results[rowIndex("mouse buttons field")];
        ok(row.detail.indexOf(", 0 on the last release") > 0, "the mouse-buttons row shows the release's e.buttons: " + row.detail);
        clk(0); clk(2);
        ok(P.lateRightClicks > 0, "a late right click is counted, for the reset to clear");
        P.held = keptHeld; P.leftUpsAsOther = keptOther;
    });

    t("re-run re-probes, log dumps the report, detach stops the loop", function () {
        root.querySelector("[data-act=\"rerun\"]").click();
        ok(root.querySelector(".cp-summary").textContent.indexOf("yes") >= 0, "summary still populated after re-run");
        root.querySelector("[data-act=\"log\"]").click();
        ok(window.__log.some(function (l) { return l.indexOf("--- full report") >= 0; }), "full report logged");
        const cancelled = window.__clock.cancelled;
        CapabilitiesProbe.detach(state);
        eq(window.__clock.cancelled, cancelled + 1, "raf cancelled");
        eq(state.ui.loop.running, false, "loop stopped");
        eq(ACEUIAppLoader.shared.get("capabilities"), null, "and it no longer answers: the results went with it");
        eq(ACEUIAppLoader.shared.has("capabilities"), false);
    });

    /* The model recorder: the research probe behind ACEAppResearch, as a setting of this app
       so the loader restarts it on every HUD load and a recording survives Escape/resume. */
    const root2 = document.createElement("div");
    root2.id = "capabilities";
    root.remove();
    document.getElementById("center").appendChild(root2);
    // a fake engine for the recorder's notification listener (the doubles carry none)
    const fakeEngine = { handlers: {}, on: function (name, cb) { fakeEngine.handlers[name] = cb; return { clear: function () { delete fakeEngine.handlers[name]; } }; },
        emit: function (name, message) { if (fakeEngine.handlers[name]) { fakeEngine.handlers[name](message); } } };
    window.engine = fakeEngine;
    const state2 = CapabilitiesProbe.attach(root2);
    const S = ACEUIAppLoader.settings;

    t("attaching again starts the pointer counters afresh, the right button's with them", function () {
        const P = CapabilitiesProbe.pointer;
        eq(P.downs, 0); eq(P.rightDowns, 0); eq(P.rightUps, 0); eq(P.rightClicks, 0); eq(P.contextMenus, 0);
        eq(P.buttonsSeen.length, 0); eq(P.rightCancelable, null); eq(P.leftUpsAsOther, 0); eq(P.held.length, 0); eq(P.clicksAfterRight, 0); eq(P.lateRightClicks, 0); eq(P.lastUpButtons, null);
        CapabilitiesProbe.runAll(state2);
        const row = state2.results[rowIndex("right button")];
        eq(row.status, "warn"); ok(row.detail.indexOf("no mousedown yet") === 0, row.detail);
    });

    const recLines = function () { return window.__log.filter(function (l) { return l.indexOf("[capabilities] rec: ") === 0; }); };
    const recCount = function (text) { return recLines().filter(function (l) { return l.indexOf(text) >= 0; }).length; };

    t("describe renders a value for the log without JSON: no __Type tags, numbers to four decimals", function () {
        eq(CapabilitiesProbe.describe({ __Type: "X", a: 1, b: [1.23456789, "s", null, true], c: { d: undefined } }),
            "{a:1,b:[1.2346,\"s\",null,true],c:{d:undefined}}");
        eq(CapabilitiesProbe.describe(-0.5), "-0.5");
        eq(CapabilitiesProbe.describe([[[[[1]]]]]), "[[[[[...]]]]]", "depth is capped");
    });

    t("the recorder is off by default; the setting starts it and lights the Record button", function () {
        eq(state2.rec.running, false, "off at attach");
        eq(S.get("capabilities", CapabilitiesProbe.SETTING_RECORD), false, "the setting defaults to off");
        const before = recLines().length;
        S.set("capabilities", CapabilitiesProbe.SETTING_RECORD, true);
        eq(state2.rec.running, true, "running once the setting is on");
        ok(state2.recordButton.classList.contains("cp-on"), "the button is lit");
        ok(recLines().length > before, "it announced itself in the log");
    });

    t("a slow field is logged once per change, with the lap position; a lap boundary writes the summary", function () {
        window.ModelTiming = { current: "00:01.000", splits: [], splits_p: [], invalid: false };
        window.ModelCurrentCar.current_lap_time_ms = 1000;
        window.ModelCurrentCar.npos = 0.1;
        window.__clock.step(1000);
        window.__clock.step(1016);
        eq(recCount("initial timing.splits"), 1, "logged once at first sight");
        eq(recCount("changed timing.splits"), 0, "not again while unchanged");
        window.ModelTiming.splits = ["00:30.000"];
        window.ModelCurrentCar.npos = 0.34;
        window.__clock.step(1032);
        eq(recCount("changed timing.splits"), 1, "once on the change");
        ok(recLines().some(function (l) { return l.indexOf("changed timing.splits") >= 0 && l.indexOf("npos:0.34") >= 0; }), "with the lap position at the change");
        window.ModelCurrentCar.current_lap_time_ms = 20;
        window.__clock.step(1048);
        eq(recCount("LAP BOUNDARY"), 1, "the lap clock going backwards is a lap");
        eq(recCount("lap summary (lap boundary)"), 1, "and the summary follows it");
        // a UI notification is logged whole, with where in the lap it came; the car-status kind is not
        fakeEngine.emit("UINotification", { __Type: "UINotification", type: "UINotificationType_SessionPenalty", tuples: [{ values: ["{PENALTY_CLEARED_KEY} #0", "InvestigationType_Racecar_Cut", "lblNotificationPenalty_NO_GAIN"] }] });
        fakeEngine.emit("UINotification", { type: "UINotificationType_Car", tuples: [] });
        eq(recCount("NOTICE "), 1, "one notice logged");
        ok(recLines().some(function (l) { return l.indexOf("NOTICE {type:\"UINotificationType_SessionPenalty\",tuples:[{values:[\"{PENALTY_CLEARED_KEY} #0\",\"InvestigationType_Racecar_Cut\",\"lblNotificationPenalty_NO_GAIN\"]}]} at {npos:0.34") >= 0; }), "whole, with the lap position");
    });

    t("full review 2026-09-24: the game correcting its lap clock is one line, not a lap; a real wrap, or the lap count moving, is a lap", function () {
        const car = window.ModelCurrentCar;
        car.current_lap_time_ms = 30000; window.__clock.step(2000);
        const laps = recCount("LAP BOUNDARY");
        car.current_lap_time_ms = 29955; window.__clock.step(2016);
        eq(recCount("LAP BOUNDARY"), laps, "45 ms back far from the line: no lap");
        eq(recCount("CLOCK STEP BACK: lap clock 30000 -> 29955"), 1, "one line for the correction, in the fields the replay extractor reads");
        car.current_lap_time_ms = 29000; window.__clock.step(2032);
        eq(recCount("LAP BOUNDARY"), laps, "955 ms back, far from the line: still a correction");
        car.current_lap_time_ms = 40; window.__clock.step(2048);
        eq(recCount("LAP BOUNDARY"), laps + 1, "back to the line: a lap");
        car.low_frequency = { total_lap_count: 3 }; car.current_lap_time_ms = 5000; window.__clock.step(2064);
        car.low_frequency = { total_lap_count: 4 }; car.current_lap_time_ms = 5016; window.__clock.step(2080);
        eq(recCount("LAP BOUNDARY"), laps + 2, "the lap count moving is a lap, whatever the clock does");
        car.low_frequency = undefined;
    });

    t("second review 2026-09-24: a count a frame behind the clock's boundary is that boundary; a frame without the clock keeps the last one; corrections every frame are one line in 250 ms", function () {
        const car = window.ModelCurrentCar;
        car.low_frequency = { total_lap_count: 5 }; car.current_lap_time_ms = 90000; window.__clock.step(3000);
        const laps = recCount("LAP BOUNDARY");
        car.current_lap_time_ms = 20; window.__clock.step(3016);
        eq(recCount("LAP BOUNDARY"), laps + 1, "the clock wraps: a lap");
        car.low_frequency = { total_lap_count: 6 }; car.current_lap_time_ms = 36; window.__clock.step(3032);
        eq(recCount("LAP BOUNDARY"), laps + 1, "the count a frame late is the same boundary, not a lap of one frame");
        car.current_lap_time_ms = 60000; window.__clock.step(3048);
        car.current_lap_time_ms = undefined; window.__clock.step(3064);
        car.current_lap_time_ms = 30; window.__clock.step(3080);
        eq(recCount("LAP BOUNDARY"), laps + 2, "a frame with no clock between: the wrap still seen against the last clock");
        ok(recLines().some(function (l) { return l.indexOf("LAP BOUNDARY: lap clock 60000 -> 30") >= 0; }), "and logged from it");
        car.current_lap_time_ms = 40000; window.__clock.step(3200);
        const steps = recCount("CLOCK STEP BACK");
        car.current_lap_time_ms = 39990; window.__clock.step(3216);
        car.current_lap_time_ms = 39980; window.__clock.step(3232);
        car.current_lap_time_ms = 39970; window.__clock.step(3248);
        eq(recCount("CLOCK STEP BACK"), steps + 1, "three corrections in 32 ms: one line");
        car.current_lap_time_ms = 39960; window.__clock.step(3600);
        eq(recCount("CLOCK STEP BACK"), steps + 2, "the next after the gap");
        ok(recLines().some(function (l) { return l.indexOf("CLOCK STEP BACK: lap clock 39970 -> 39960") >= 0 && l.indexOf("(2 more since the last line)") >= 0; }), "saying how many it held back");
        car.low_frequency = undefined;
    });

    t("full review 2026-09-24: a recording switched off and on again starts from nothing", function () {
        const starts = recCount("start: ");
        S.set("capabilities", CapabilitiesProbe.SETTING_RECORD, false);
        S.set("capabilities", CapabilitiesProbe.SETTING_RECORD, true);
        eq(state2.rec.frames, 0, "no frames carried over"); eq(state2.rec.lap, null, "no lap carried over");
        window.__clock.step(2096);
        eq(recCount("start: "), starts + 1, "the first frame of the new recording writes its start line again");
    });

    t("the button switches it off with a final summary, and detach stops a running recorder", function () {
        const stoppedBefore = recCount("stopped (switched off)");
        state2.recordButton.click();
        eq(state2.rec.running, false, "off after the button");
        eq(S.get("capabilities", CapabilitiesProbe.SETTING_RECORD), false, "through the setting, which is the truth");
        eq(recCount("stopped (switched off)"), stoppedBefore + 1, "with a final line");
        S.set("capabilities", CapabilitiesProbe.SETTING_RECORD, true);
        eq(state2.rec.running, true, "on again");
        CapabilitiesProbe.detach(state2);
        eq(state2.rec.running, false, "detach stops it");
        eq(recCount("stopped (detached)"), 1);
        S.set("capabilities", CapabilitiesProbe.SETTING_RECORD, false);
        // and detach leaves nothing behind: no fixture in the page, no listener counting
        CapabilitiesProbe.detach(state);
        eq(document.querySelectorAll(".cp-pe-probe, .cp-pe-strip, .cp-pe-control, .cp-pe-control-strip").length, 0, "the pointer fixture is gone");
        const moves = CapabilitiesProbe.pointer.moves;
        window.dispatchEvent(new MouseEvent("mousemove", { clientX: 5, clientY: 5 }));
        eq(CapabilitiesProbe.pointer.moves, moves, "and nothing is listening any more");
    });

    H.finish();
}());
</script>
