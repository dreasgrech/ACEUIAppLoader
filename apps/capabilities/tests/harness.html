<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ACE UI Capabilities Probe tests</title>
<style>
  body { margin: 0; background: #222; color: #ddd; font: 12px monospace; }
  .absolutecenter { position: relative; width: 1600px; height: 900px; overflow: hidden; }
  #results { white-space: pre; }
</style>
<!-- shared test doubles (fake frame clock, in-memory localStorage, console capture) and the library, from the loader repo -->
<script src="../../../tests/lib/doubles.js"></script>
<script src="../../../tests/lib/lib.js"></script>
<link rel="stylesheet" type="text/css" href="../capabilities/capabilities.css">
<script>window.ModelCurrentCar = { has_focused_car: true, gas_percent: 0.5 };</script>
<script src="../capabilities/capabilities.js"></script>
</head>
<body>
<div class="absolutecenter" id="center"></div>
<script>
(function () {
    const H = window.__harness;
    const t = H.t, eq = H.eq, ok = H.ok;

    const rowIndex = function (name) {
        let found = -1;
        CapabilitiesProbe.CHECKS.forEach(function (c, i) { if (c.name === name) { found = i; } });
        return found;
    };

    const root = document.createElement("div");
    root.id = "capabilities";
    document.getElementById("center").appendChild(root);
    const state = CapabilitiesProbe.attach(root);

    t("attach builds the panel once, hidden until placed, and logs with the app's prefix", function () {
        ok(root.classList.contains("ace-capabilities"), "root class");
        ok(root.querySelector(".cp-body"), "body built");
        eq(root.querySelector(".cp-title").textContent, "capabilities", "title falls back to the name outside the game");
        eq(root.style.visibility, "hidden", "hidden until positioned");
        ok(state.ui.loop.running, "loop running");
        ok(window.__log.some(function (l) { return l.indexOf("[capabilities] attached") === 0; }), "prefixed log");
    });

    t("every check renders a colour-coded row and the summary counts them", function () {
        eq(state.rows.length, CapabilitiesProbe.CHECKS.length, "one row per check");
        const summary = root.querySelector(".cp-summary").textContent;
        ok(summary.indexOf("yes") >= 0, "summary names a yes count");
        ok(state.rows[rowIndex("Promise")].dot.className.indexOf("cp-yes") >= 0, "Promise detected present");
        ok(state.rows[rowIndex("engine audio bridge")].dot.className.indexOf("cp-no") >= 0, "engine bridge absent outside the game");
    });

    /* Three checks are asynchronous and slow on purpose, so a re-run leaves the previous
       run's probes in flight; their callbacks would write an old answer into a fresh row
       and decrement a pending count that is no longer theirs. */
    t("a re-run starts a new generation, so probes still in flight cannot write into it", function () {
        const before = state.run;

        CapabilitiesProbe.runAll(state);
        eq(state.run, before + 1, "the run is numbered");
        eq(state.results.length, CapabilitiesProbe.CHECKS.length, "and every row was answered again");
        ok(state.results.every(function (r) { return r && r.name; }), "each result knows its check");
    });

    t("while attached it answers other apps, and stops answering when it is not", function () {
        const probe = ACEUIAppLoader.shared.get("capabilities");
        ok(probe, "registered while attached");
        eq(probe.checks().length, CapabilitiesProbe.CHECKS.length, "it can say what it probes");
        eq(probe.status("Promise"), "yes", "and what it found");
        eq(probe.status("not a check"), null, "a question it has no answer to is null, not a guess");
        eq(probe.results().length, CapabilitiesProbe.CHECKS.length);
        probe.results().pop();
        eq(ACEUIAppLoader.shared.get("capabilities").results().length, CapabilitiesProbe.CHECKS.length, "a copy, not the live list");
    });

    t("re-run re-probes, log dumps the report, detach stops the loop", function () {
        root.querySelector("[data-act=\"rerun\"]").click();
        ok(root.querySelector(".cp-summary").textContent.indexOf("yes") >= 0, "summary still populated after re-run");
        root.querySelector("[data-act=\"log\"]").click();
        ok(window.__log.some(function (l) { return l.indexOf("--- full report") >= 0; }), "full report logged");
        const cancelled = window.__clock.cancelled;
        CapabilitiesProbe.detach(state);
        eq(window.__clock.cancelled, cancelled + 1, "raf cancelled");
        eq(state.ui.loop.running, false, "loop stopped");
        eq(ACEUIAppLoader.shared.get("capabilities"), null, "and it no longer answers: the results went with it");
        eq(ACEUIAppLoader.shared.has("capabilities"), false);
    });

    /* The model recorder: the research probe behind ACEAppResearch, as a setting of this app
       so the loader restarts it on every HUD load and a recording survives Escape/resume. */
    const root2 = document.createElement("div");
    root2.id = "capabilities";
    root.remove();
    document.getElementById("center").appendChild(root2);
    // a fake engine for the recorder's notification listener (the doubles carry none)
    const fakeEngine = { handlers: {}, on: function (name, cb) { fakeEngine.handlers[name] = cb; return { clear: function () { delete fakeEngine.handlers[name]; } }; },
        emit: function (name, message) { if (fakeEngine.handlers[name]) { fakeEngine.handlers[name](message); } } };
    window.engine = fakeEngine;
    const state2 = CapabilitiesProbe.attach(root2);
    const S = ACEUIAppLoader.settings;
    const recLines = function () { return window.__log.filter(function (l) { return l.indexOf("[capabilities] rec: ") === 0; }); };
    const recCount = function (text) { return recLines().filter(function (l) { return l.indexOf(text) >= 0; }).length; };

    t("describe renders a value for the log without JSON: no __Type tags, numbers to four decimals", function () {
        eq(CapabilitiesProbe.describe({ __Type: "X", a: 1, b: [1.23456789, "s", null, true], c: { d: undefined } }),
            "{a:1,b:[1.2346,\"s\",null,true],c:{d:undefined}}");
        eq(CapabilitiesProbe.describe(-0.5), "-0.5");
        eq(CapabilitiesProbe.describe([[[[[1]]]]]), "[[[[[...]]]]]", "depth is capped");
    });

    t("the recorder is off by default; the setting starts it and lights the Record button", function () {
        eq(state2.rec.running, false, "off at attach");
        eq(S.get("capabilities", CapabilitiesProbe.SETTING_RECORD), false, "the setting defaults to off");
        const before = recLines().length;
        S.set("capabilities", CapabilitiesProbe.SETTING_RECORD, true);
        eq(state2.rec.running, true, "running once the setting is on");
        ok(state2.recordButton.classList.contains("cp-on"), "the button is lit");
        ok(recLines().length > before, "it announced itself in the log");
    });

    t("a slow field is logged once per change, with the lap position; a lap boundary writes the summary", function () {
        window.ModelTiming = { current: "00:01.000", splits: [], splits_p: [], invalid: false };
        window.ModelCurrentCar.current_lap_time_ms = 1000;
        window.ModelCurrentCar.npos = 0.1;
        window.__clock.step(1000);
        window.__clock.step(1016);
        eq(recCount("initial timing.splits"), 1, "logged once at first sight");
        eq(recCount("changed timing.splits"), 0, "not again while unchanged");
        window.ModelTiming.splits = ["00:30.000"];
        window.ModelCurrentCar.npos = 0.34;
        window.__clock.step(1032);
        eq(recCount("changed timing.splits"), 1, "once on the change");
        ok(recLines().some(function (l) { return l.indexOf("changed timing.splits") >= 0 && l.indexOf("npos:0.34") >= 0; }), "with the lap position at the change");
        window.ModelCurrentCar.current_lap_time_ms = 20;
        window.__clock.step(1048);
        eq(recCount("LAP BOUNDARY"), 1, "the lap clock going backwards is a lap");
        eq(recCount("lap summary (lap boundary)"), 1, "and the summary follows it");
        // a UI notification is logged whole, with where in the lap it came; the car-status kind is not
        fakeEngine.emit("UINotification", { __Type: "UINotification", type: "UINotificationType_SessionPenalty", tuples: [{ values: ["{PENALTY_CLEARED_KEY} #0", "InvestigationType_Racecar_Cut", "lblNotificationPenalty_NO_GAIN"] }] });
        fakeEngine.emit("UINotification", { type: "UINotificationType_Car", tuples: [] });
        eq(recCount("NOTICE "), 1, "one notice logged");
        ok(recLines().some(function (l) { return l.indexOf("NOTICE {type:\"UINotificationType_SessionPenalty\",tuples:[{values:[\"{PENALTY_CLEARED_KEY} #0\",\"InvestigationType_Racecar_Cut\",\"lblNotificationPenalty_NO_GAIN\"]}]} at {npos:0.34") >= 0; }), "whole, with the lap position");
    });

    t("the button switches it off with a final summary, and detach stops a running recorder", function () {
        state2.recordButton.click();
        eq(state2.rec.running, false, "off after the button");
        eq(S.get("capabilities", CapabilitiesProbe.SETTING_RECORD), false, "through the setting, which is the truth");
        ok(recCount("stopped (switched off)") === 1, "with a final line");
        S.set("capabilities", CapabilitiesProbe.SETTING_RECORD, true);
        eq(state2.rec.running, true, "on again");
        CapabilitiesProbe.detach(state2);
        eq(state2.rec.running, false, "detach stops it");
        eq(recCount("stopped (detached)"), 1);
        S.set("capabilities", CapabilitiesProbe.SETTING_RECORD, false);
    });

    H.finish();
}());
</script>
</body>
</html>
