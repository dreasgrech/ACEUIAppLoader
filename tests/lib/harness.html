<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ACEUIAppLoader library tests</title>
<style>
  body { margin: 0; background: #222; color: #ddd; font: 12px monospace; }
  /* stand-in for the game's HUD container */
  .absolutecenter { position: relative; width: 1600px; height: 900px; overflow: hidden; }
  .panel { position: absolute; left: 2rem; bottom: 2rem; width: 200px; height: 100px; background: #444; }
  #results { white-space: pre; }
</style>
<script src="doubles.js"></script>
<script>
// Fake Cohtml engine. Answers the video preset list (two markers, one real preset,
// one malformed marker) a tick after being asked, like the game does, so discovery
// and the stock-handler filter can be tested. Records every trigger.
window.__engine = { handlers: {}, triggered: [] };
window.engine = {
    on: function (name, callback, context) {
        const list = window.__engine.handlers[name] = window.__engine.handlers[name] || [];
        const entry = { cb: callback, ctx: context };
        list.push(entry);
        return { clear: function () { const i = list.indexOf(entry); if (i >= 0) { list.splice(i, 1); } } };
    },
    mute: 0,
    trigger: function (name, command, data) {
        window.__engine.triggered.push([name, command, data]);
        if (command !== "SettingsRequestVideoPresetList") { return; }
        if (window.engine.mute > 0) { window.engine.mute -= 1; return; }
        window.setTimeout(function () {
            const response = { __Type: "SettingsResponseVideoPresetList", response: "OK",
                filenames: ["ACEUIAppLoader-beta", "MyLowSettings", "ACEUIAppLoader-alpha", "ACEUIAppLoader-", "ACEUIAppLoader-bad#name"] };
            (window.__engine.handlers["SettingsResponseVideoPresetList"] || []).slice().forEach(function (e) { e.cb.call(e.ctx || window.engine, response); });
        }, 0);
    },
    whenReady: Promise.resolve()
};
</script>
<!-- the library exactly as build_loader.py appends it to cohtml.js, same order -->
<script src="lib.js"></script>
</head>
<body>
<div class="absolutecenter" id="center"></div>
<pre id="results"></pre>
<div id="done" hidden></div>

<script>
// Runs on DOMContentLoaded: the loader registered its own listener first, so its
// boot line is logged before the cases run, exactly as on a game page.
document.addEventListener("DOMContentLoaded", function () {
    const H = window.__harness;
    const t = H.t, eq = H.eq, ok = H.ok, near = H.near;
    const last = function (arr) { return arr[arr.length - 1]; };

    /*
     * A real 100px window onto 500px of content, so the scroller's arithmetic is checked
     * against layout rather than against a mock. Cohtml ignores `overflow: auto`, which is
     * why this behaviour exists at all.
     */
    const scrollFixture = function (follow, onFollow) {
        const dv = function (props) { return ACEUIAppLoader.dom.div(props); };
        const box = dv({ position: "absolute", left: "0", top: "0", width: "200px" });
        const body = dv({ height: "100px", overflow: "hidden" });
        const track = dv({ height: "100px", width: "8px" });
        const thumb = dv({ width: "8px" });

        body.appendChild(dv({ height: "500px" }));
        track.appendChild(thumb);
        box.appendChild(body);
        box.appendChild(track);
        center.appendChild(box);

        return {
            box: box,
            body: body,
            track: track,
            thumb: thumb,
            scroller: ACEUIAppLoader.scroll.attach({
                body: body,
                track: track,
                thumb: thumb,
                follow: follow,
                nofitClass: "nofit",
                draggingClass: "dragging",
                onFollow: onFollow
            })
        };
    };

    const clock = window.__clock;
    const center = document.getElementById("center");
    const mouse = function (type, x, y, target) {
        (target || window).dispatchEvent(new MouseEvent(type, { clientX: x, clientY: y, bubbles: true }));
    };
    /* Two samples that approach (x, y) from 40px inside: the drawer opens on a movement, never on a jump from wherever the pointer last was. */
    const glide = function (x, y) {
        mouse("mousemove", x + (x < window.innerWidth / 2 ? 40 : -40), y);
        mouse("mousemove", x, y);
    };
    const makeHud = function (elements) {
        const hud = { currentLayout: "default", StoredData: { lastLayout: "default", layouts: { default: { elements: elements || {} } } } };
        hud.elementModified = function (id, props) { hud.StoredData.layouts.default.elements[id] = props; };
        return hud;
    };
    /** A stand-in for an app root: a box at left/top/width/height inside the container rect `f`. */
    const anchorAt = function (f, left, top, width, height) {
        return { getBoundingClientRect: function () { return { left: f.left + left, top: f.top + top, right: f.left + left + width, bottom: f.top + top + height, width: width, height: height }; } };
    };
    const makePanel = function (opts) {
        const root = document.createElement("div");
        root.className = "panel";
        center.appendChild(root);
        const panel = ACEUIAppLoader.panel.attach(root, Object.assign({ hudId: "hud_test", storageKey: "acetest.pos", log: function () {} }, opts || {}));
        return { root: root, panel: panel };
    };
    const HUD_ID = "hud_test", KEY = "acetest.pos", WAIT = ACEUIAppLoader.panel.RESTORE_WAIT_MS;

    // ---- core ---------------------------------------------------------------------------

    // first of all, so that no press made by a later case is held yet
    t("drawer: before any press, the drawer holds no left button", function () {
        eq(ACEUIAppLoader.drawer.state.leftDown, false);
    });

    t("core: namespace, version, page, window property", function () {
        eq(typeof ACEUIAppLoader, "object"); eq(window.ACEUIAppLoader, ACEUIAppLoader, "window.ACEUIAppLoader");
        ok(/^\d+\.\d+\.\d+$/.test(ACEUIAppLoader.VERSION), "semver"); eq(ACEUIAppLoader.page, "harness.html", "page");
        eq(ACEUIAppLoader.LOG_PREFIX, "[ACEUIAppLoader]"); eq(ACEUIAppLoader.HUD_HIDDEN_CLASS, "hide-hud");
        ["console", "persist", "panel", "loop", "loader"].forEach(function (ns) { eq(typeof ACEUIAppLoader[ns], "object", ns); });
    });

    t("core: helpers", function () {
        eq(ACEUIAppLoader.clamp(5, 0, 1), 1); eq(ACEUIAppLoader.clamp(-1, 0, 1), 0); eq(ACEUIAppLoader.clamp(0.5, 0, 1), 0.5);
        eq(ACEUIAppLoader.el("div", "a", { "data-x": 1 }) + ACEUIAppLoader.close("div"), '<div class="a" data-x="1"></div>');
        eq(ACEUIAppLoader.percentText(0.499), "50%"); eq(ACEUIAppLoader.percentText(0), "0%");
        eq(ACEUIAppLoader.toArray(document.querySelectorAll("div")).length >= 1, true);
        eq(ACEUIAppLoader.hudHidden(), false); document.body.classList.add("hide-hud"); eq(ACEUIAppLoader.hudHidden(), true); document.body.classList.remove("hide-hud");
        ACEUIAppLoader.logger("[T]")("hi"); eq(last(window.__log), "[T] hi", "logger prefix"); ACEUIAppLoader.log("x"); eq(last(window.__log), "[ACEUIAppLoader] x");
        const outer = document.createElement("div"), inner = document.createElement("span"); inner.setAttribute("data-nodrag", ""); outer.appendChild(inner);
        const deep = document.createElement("b"); inner.appendChild(deep);
        eq(ACEUIAppLoader.closestWithAttribute(deep, "data-nodrag", outer), inner, "closest finds ancestor"); eq(ACEUIAppLoader.closestWithAttribute(outer, "data-nodrag", outer), null, "stops at root");
    });

    // ---- console ------------------------------------------------------------------------

    t("console: hook captures levels and text, still calls the original", function () {
        ACEUIAppLoader.console.clear();
        console.log("hello", 42, true, null);
        console.warn("careful");
        console.error(new Error("boom"));
        const e = ACEUIAppLoader.console.entries();
        eq(e.length, 3, "entries"); eq(e[0].level, "log"); eq(e[0].text, "hello 42 true null"); eq(e[1].level, "warn"); eq(e[1].text, "careful");
        eq(e[2].level, "error"); eq(e[2].text, "Error: boom");
        eq(last(window.__log).indexOf("hello 42 true"), 0, "original console.log reached"); eq(window.__warn.length >= 2, true, "original warn/error reached");
        ok(e[0].seq < e[1].seq && e[1].seq < e[2].seq, "seq increases"); eq(typeof e[0].t, "number");
    });

    t("console: objects are formatted compactly and bounded", function () {
        ACEUIAppLoader.console.clear();
        console.log({ a: 1, b: "x", c: [1, 2, { d: 3 }], f: function named() {} });
        eq(ACEUIAppLoader.console.entries()[0].text, '{a: 1, b: "x", c: [1, 2, {...}], f: [function named]}');
        const big = {}; let i; for (i = 0; i < 30; i += 1) { big["k" + i] = i; }
        console.log(big);
        ok(ACEUIAppLoader.console.entries()[1].text.indexOf("...}") > 0, "key cap");
        console.log("x".repeat(1000));
        eq(ACEUIAppLoader.console.entries()[2].text.length, 403, "text cap");
        eq(ACEUIAppLoader.console.format([1, [2, [3]]]), "[1, [2, [...]]]", "format export");
    });

    t("console: a value that refuses to be formatted never throws back into whoever logged it", function () {
        ACEUIAppLoader.console.clear();
        const hostile = {};
        Object.defineProperty(hostile, "boom", { enumerable: true, get: function () { throw new Error("no"); } });
        let threw = false;
        try { console.log("before", hostile); } catch (e) { threw = true; }
        eq(threw, false, "the caller -- the stock bundle, in the middle of its own work -- is not aborted");
        eq(last(window.__log).indexOf("before"), 0, "the original console.log still ran");
        const e = ACEUIAppLoader.console.entries();
        eq(e.length, 1); eq(e[0].text, ACEUIAppLoader.console.FORMAT_FAILED_TEXT, "the buffer says a line was lost");
        console.log("again", hostile);
        eq(ACEUIAppLoader.console.entries().length, 1, "and says it once per page, not once per line");
        console.log("fine"); eq(ACEUIAppLoader.console.entries().length, 2, "later lines are captured as before");
        window.dispatchEvent(new ErrorEvent("error", { message: "", error: hostile, filename: "y.js", lineno: 3 }));
        eq(ACEUIAppLoader.console.entries().length, 2, "an uncaught error carrying a hostile value is swallowed the same way");
    });

    t("console: ring buffer keeps the last MAX_ENTRIES", function () {
        ACEUIAppLoader.console.clear();
        let i; for (i = 0; i < ACEUIAppLoader.console.MAX_ENTRIES + 10; i += 1) { console.log("n" + i); }
        eq(ACEUIAppLoader.console.entries().length, ACEUIAppLoader.console.MAX_ENTRIES);
        eq(ACEUIAppLoader.console.entries()[0].text, "n10", "oldest dropped");
    });

    t("console: subscribe / unsubscribe / capture / errors", function () {
        ACEUIAppLoader.console.clear();
        const seen = [];
        const off = ACEUIAppLoader.console.subscribe(function (entry) { seen.push(entry.level + ":" + entry.text); });
        eq(ACEUIAppLoader.console.listenerCount(), 1);
        console.log("a"); ACEUIAppLoader.console.capture("input", "> 1+1");
        eq(seen.join("|"), "log:a|input:> 1+1");
        eq(window.__log.indexOf("> 1+1"), -1, "capture does not reach console");
        window.dispatchEvent(new ErrorEvent("error", { message: "kaboom", filename: "x.js", lineno: 7 }));
        eq(last(seen), "error:uncaught: kaboom at x.js:7");
        off(); eq(ACEUIAppLoader.console.listenerCount(), 0);
        console.log("b"); eq(seen.length, 3, "no notification after unsubscribe");
        // a listener that logs must not recurse
        const off2 = ACEUIAppLoader.console.subscribe(function () { console.log("from listener"); });
        console.log("trigger"); off2();
        eq(last(ACEUIAppLoader.console.entries()).text, "from listener", "stored once, no infinite loop");

        /* A listener that throws used to leave the re-entry guard set, which stopped every
           later notification for the rest of the session -- the console would quietly stop
           updating with nothing in the log to say why. */
        const after = [];
        const offBad = ACEUIAppLoader.console.subscribe(function () { throw new Error("listener boom"); });
        const offGood = ACEUIAppLoader.console.subscribe(function (entry) { after.push(entry.text); });

        console.log("first");
        console.log("second");
        ok(after.indexOf("first") >= 0 && after.indexOf("second") >= 0, "the good listener keeps hearing");
        ok(window.__log.some(function (l) { return l.indexOf("[console] listener failed") >= 0; }), "and the bad one is named");
        offBad(); offGood();
    });

    // ---- persist -------------------------------------------------------------------------

    t("core: errorText reads anything that was thrown, safely runs someone else's callback", function () {
        const core = ACEUIAppLoader;
        const before = window.__log.length;

        eq(core.errorText(new Error("boom")), "Error: boom", "an Error");
        eq(core.errorText("boom"), "boom", "a thrown string");
        eq(core.errorText({ message: "no name" }), "no name", "an error-shaped object");
        eq(core.safely("a test", function () { return 42; }), 42, "the value comes back");
        eq(core.safely("a test", function () { throw new Error("nope"); }), undefined, "a thrower returns undefined");
        ok(window.__log.length > before, "and says so in the log");
        ok(last(window.__log).indexOf("a test failed: Error: nope") >= 0, "naming what failed");
    });

    t("dom: elements with inline styles, class toggles and emptying", function () {
        const dom = ACEUIAppLoader.dom;
        const node = dom.make("span", { color: "rgb(1, 2, 3)" }, "hi");

        eq(node.tagName, "SPAN", "tag");
        eq(node.textContent, "hi", "text");
        eq(node.style.color, "rgb(1, 2, 3)", "inline style");
        eq(dom.div({}).tagName, "DIV", "div shorthand");
        dom.setClass(node, "on", true);
        ok(node.classList.contains("on"), "class added");
        dom.setClass(node, "on", false);
        ok(!node.classList.contains("on"), "class removed");
        dom.setClass(null, "on", true);
        node.appendChild(dom.div({}));
        eq(dom.clear(node).childNodes.length, 0, "cleared");
        ok(typeof dom.THEME.ink === "string", "the palette is here once, not once per surface");
    });

    t("dom: snapToPixels moves a box's four edges onto whole pixels by growing its margins, and is idempotent", function () {
        const D = ACEUIAppLoader.dom;
        const host = document.createElement("div");
        host.style.cssText = "position:absolute;left:10.4px;top:20.7px;width:200px;height:100px;display:flex;align-items:stretch";
        document.getElementById("center").appendChild(host);
        const box = document.createElement("div");
        box.style.cssText = "flex:1 1 auto;margin-left:0.3px";
        host.appendChild(box);
        const before = box.getBoundingClientRect();
        ok(before.left % 1 !== 0 && before.right % 1 !== 0 && before.top % 1 !== 0, "starts on fractions: " + before.left + " " + before.right + " " + before.top);
        const fix = D.snapToPixels(box);
        ok(fix && fix.left > 0 && fix.right > 0 && fix.top > 0, "corrections for the fractional edges: " + JSON.stringify(fix));
        const after = box.getBoundingClientRect();
        [after.left, after.right, after.top, after.bottom].forEach(function (edge, i) { near(edge, Math.round(edge), 1 / 32, ["left", "right", "top", "bottom"][i] + " on a whole pixel (to Chromium's 1/64 px layout unit)"); });
        ok(after.left > before.left && after.right < before.right, "the box shrank inward, it did not move outward");
        eq(box.style.marginLeft, (0.3 + fix.left).toFixed(3) + "px", "an existing margin is grown, not replaced");
        const again = D.snapToPixels(box);
        eq(JSON.stringify(again), JSON.stringify({ left: 0, top: 0, right: 0, bottom: 0 }), "a snapped box needs nothing: idempotent");
        const empty = document.createElement("div"); host.appendChild(empty);
        eq(D.snapToPixels(empty), null, "no size yet: nothing to snap, null");
        host.remove();
    });

    t("dom: a listener bag lets go of everything in one call", function () {
        const dom = ACEUIAppLoader.dom;
        const bag = dom.listeners();
        const target = dom.div({});
        let hits = 0;
        const count = function () { hits += 1; };

        bag.on(target, "click", count);
        bag.on(target, "mousedown", count);
        bag.on(window, "ace-test", count);
        eq(bag.count(), 3, "three held");
        target.dispatchEvent(new Event("click"));
        target.dispatchEvent(new Event("mousedown"));
        window.dispatchEvent(new Event("ace-test"));
        eq(hits, 3, "all three fired");
        eq(bag.off(), 3, "three released");
        target.dispatchEvent(new Event("click"));
        window.dispatchEvent(new Event("ace-test"));
        eq(hits, 3, "and none fired again");
        eq(bag.off(), 0, "releasing twice is harmless");
        eq(typeof dom.on(null, "click", count), "function", "a missing target still returns an undo");
    });

    t("keys: a key is recognised by code, by character and by the legacy keyCode", function () {
        const keys = ACEUIAppLoader.keys;

        ok(keys.is({ code: "Backquote" }, "Backquote"), "by code");
        ok(keys.is({ key: "`" }, "Backquote"), "by the character the engine sends as key");
        ok(keys.is({ keyCode: 192 }, "Backquote"), "by the legacy keyCode the stock bundle reads");
        ok(keys.is({ key: " " }, "Space"), "space as a character");
        ok(!keys.is({ code: "KeyA" }, "Backquote"), "a different key");
        ok(!keys.is({ code: "KeyA" }, ""), "no key wanted");
        eq(keys.nameOf({ key: "," }), "Comma", "characters fold onto names");
        eq(keys.nameOf({ code: "KeyA", key: "a" }), "KeyA", "code wins over character");
    });

    t("keys: bind follows a key kept in settings and stays out of a text box", function () {
        const keys = ACEUIAppLoader.keys;
        const field = document.createElement("input");
        let wanted = "Backquote";
        let fired = 0;
        const unbind = keys.bind(function () { return wanted; }, function () { fired += 1; });

        document.body.appendChild(field);
        window.dispatchEvent(new KeyboardEvent("keydown", { code: "Backquote" }));
        eq(fired, 1, "the bound key fires");
        window.dispatchEvent(new KeyboardEvent("keydown", { code: "KeyJ" }));
        eq(fired, 1, "another key does not");
        wanted = "KeyJ";
        window.dispatchEvent(new KeyboardEvent("keydown", { code: "KeyJ" }));
        eq(fired, 2, "moving the setting moves the hotkey, with no rebinding");
        field.dispatchEvent(new KeyboardEvent("keydown", { code: "KeyJ", bubbles: true }));
        eq(fired, 2, "and it never fires while someone is typing");
        ok(keys.isTyping({ target: field }), "an input is a typing target");
        ok(!keys.isTyping({ target: document.body }), "the body is not");
        unbind();
        window.dispatchEvent(new KeyboardEvent("keydown", { code: "KeyJ" }));
        eq(fired, 2, "unbind releases it");
        field.parentNode.removeChild(field);
    });

    t("scroll: the wheel moves the box against the browser's sign, and the thumb only moves when it must", function () {
        const f = scrollFixture(false, null);
        let was;

        eq(f.body.clientHeight, 100, "the fixture has real geometry");
        eq(f.body.scrollHeight, 500, "and real content");
        f.body.dispatchEvent(new WheelEvent("wheel", { deltaY: -3, bubbles: true, cancelable: true }));
        eq(f.body.scrollTop, 25, "a negative deltaY scrolls down here (the engine inverts it)");
        f.scroller.sync();
        eq(f.thumb.style.height, "20px", "thumb sized to the visible fraction");
        eq(f.thumb.style.transform, "translateY(5px)", "and placed by the scroll position");
        was = f.thumb.style.height;
        f.scroller.sync();
        eq(f.thumb.style.height, was, "an unchanged thumb is not rewritten");
        f.body.dispatchEvent(new WheelEvent("wheel", { deltaY: 3, bubbles: true, cancelable: true }));
        eq(f.body.scrollTop, 0, "and back up, clamped at the top");
        ok(!f.track.classList.contains("nofit"), "the track is in use while the content overflows");
        f.scroller.detach();
        f.box.parentNode.removeChild(f.box);
    });

    t("scroll: following sticks to the newest content until you scroll away", function () {
        const seen = [];
        const f = scrollFixture(true, function (on) { seen.push(on); });

        f.scroller.toBottom();
        eq(f.body.scrollTop, 400, "at the bottom");
        ok(f.scroller.following(), "still following");
        f.scroller.scrollBy(-100);
        ok(!f.scroller.following(), "scrolling away stops it");
        eq(seen.length, 1, "the app is told once");
        eq(seen[0], false, "that following stopped");
        f.scroller.scrollBy(100);
        ok(f.scroller.following(), "reaching the bottom resumes it");
        eq(seen.length, 2, "and told again");
        f.scroller.detach();
        f.box.parentNode.removeChild(f.box);
    });

    t("scroll: the thumb is dragged on the window, and detach lets go of everything", function () {
        const f = scrollFixture(false, null);

        f.scroller.sync();
        f.thumb.dispatchEvent(new MouseEvent("mousedown", { button: 2, clientY: 0, bubbles: true, cancelable: true }));
        ok(!f.track.classList.contains("dragging"), "a right press on the thumb is the panel's right-click, not a drag");
        const tr = f.track.getBoundingClientRect();
        f.track.dispatchEvent(new MouseEvent("mousedown", { button: 2, clientX: tr.left + 2, clientY: tr.top + 90, bubbles: true, cancelable: true }));
        eq(f.body.scrollTop, 0, "nor a jump on the track (pressed where a left press does jump, below)");
        f.track.dispatchEvent(new MouseEvent("mousedown", { button: 1, clientX: tr.left + 2, clientY: tr.top + 90, bubbles: true, cancelable: true }));
        eq(f.body.scrollTop, 0, "nor with the middle button");
        f.track.dispatchEvent(new MouseEvent("mousedown", { button: 0, clientX: tr.left + 2, clientY: tr.top + 90, bubbles: true, cancelable: true }));
        ok(f.body.scrollTop > 0, "the left button at the same spot jumps: " + f.body.scrollTop);
        f.body.scrollTop = 0; f.scroller.sync();
        f.thumb.dispatchEvent(new MouseEvent("mousedown", { clientY: 0, bubbles: true, cancelable: true }));
        ok(f.track.classList.contains("dragging"), "the track knows it is being dragged");
        window.dispatchEvent(new MouseEvent("mouseup", { button: 2 }));
        ok(f.track.classList.contains("dragging"), "a right release does not end the thumb drag");
        mouse("mousemove", 0, 10);
        eq(f.body.scrollTop, 50, "the body follows the pointer, scaled by the travel");
        mouse("mouseup", 0, 10);
        ok(!f.track.classList.contains("dragging"), "and lets go");
        mouse("mousemove", 0, 40);
        eq(f.body.scrollTop, 50, "a move after the release does nothing");
        f.track.dispatchEvent(new MouseEvent("mousedown", { clientY: 90, bubbles: true, cancelable: true }));
        ok(f.body.scrollTop !== 50, "a press on the track itself jumps");
        mouse("mouseup", 0, 90);
        eq(f.scroller.detach(), 2, "detach releases the wheel and the track listener");
        f.box.parentNode.removeChild(f.box);
    });

    /*
     * In game: an app switched off in the app drawer is detached within milliseconds of
     * loading, while its own probes are still in flight. The capabilities probe's
     * three-second WebSocket check then came back and re-filtered its list against a
     * scroller that was gone -- "Cannot read properties of null (reading 'scrollBy')".
     */
    t("scroll: a detached scroller is inert, so work that outlives the panel cannot throw", function () {
        const f = scrollFixture(true, null);

        f.scroller.scrollBy(40);
        eq(f.body.scrollTop, 40, "it scrolls while attached");
        f.scroller.detach();
        ok(f.scroller.detached(), "it knows it is detached");
        f.scroller.scrollBy(40);
        f.scroller.sync();
        f.scroller.toBottom();
        f.scroller.setFollow(false);
        eq(f.body.scrollTop, 40, "and every call after that does nothing at all");
        f.box.parentNode.removeChild(f.box);
    });

    t("persist: whenHudReady fires as soon as the store is there, and can be cancelled", function () {
        const persist = ACEUIAppLoader.persist;
        const hadHud = window.HUD;
        let fired = 0;
        let cancel;

        window.HUD = makeHud({});
        persist.whenHudReady(function () { fired += 1; });
        eq(fired, 1, "the store is already there: no polling at all");
        window.HUD = undefined;
        cancel = persist.whenHudReady(function () { fired += 1; });
        eq(fired, 1, "nothing to report yet");
        eq(typeof cancel, "function", "an app that detaches first can cancel");
        cancel();
        window.HUD = hadHud;
    });

    t("persist: local round trip, hud store when present", function () {
        window.HUD = null; localStorage.clear();
        eq(ACEUIAppLoader.persist.hudAvailable(), false); eq(ACEUIAppLoader.persist.readHud("hud_x"), null);
        eq(ACEUIAppLoader.persist.writeHud("hud_x", { a: 1 }), false, "no HUD object");
        eq(ACEUIAppLoader.persist.writeLocal("k", { a: 1 }), true); eq(ACEUIAppLoader.persist.readLocal("k").a, 1);
        ACEUIAppLoader.persist.removeLocal("k"); eq(ACEUIAppLoader.persist.readLocal("k"), null);

    /*
     * In game (2026-09-23): a settings window closed just before a session restart came back
     * with it. The HUD store reaches disk only when the game saves the layout, so after a
     * reload it can hold an older list than localStorage does -- and adopt() used to take it
     * whenever this page had not yet touched a window, which after a reload is always.
     */
    t("window: a HUD store older than this session's list is not adopted; the store is brought up to date instead", function () {
        const W = ACEUIAppLoader.window, P = ACEUIAppLoader.persist;
        let reopened = 0;
        const opener = function (id) { reopened += 1; W.open(id, { title: "S" }); };
        window.HUD = null;
        W.remembered.adopted = false;                              // a page before the HUD store is adopted
        W.open("stale.a", { title: "S" }); W.close("stale.a");     // closed on purpose: localStorage says so
        const local = P.readLocal(W.OPEN_STORE_KEY);
        ok(typeof local.at === "number", "the record carries when it was written");
        eq(local.ops[ACEUIAppLoader.page]["stale.a"], false, "and, the store not adopted yet, the close as a change to replay on its list");
        W.discardAll(); W.remembered.touched = false;             // the page reloads: nothing touched yet
        W.reopen("stale.a", opener);
        // the copy the game saved to disk earlier still lists it as open
        const older = { open: {}, at: local.at - 60000 }; older.open[ACEUIAppLoader.page] = ["stale.a"];
        window.HUD = makeHud({}); window.HUD.StoredData.layouts.default.elements[W.OPEN_HUD_ID] = older;
        eq(W.adopt().length, 0, "nothing is due to come back");
        clock.step(6000); eq(reopened, 0, "the window stays closed");
        eq((window.HUD.StoredData.layouts.default.elements[W.OPEN_HUD_ID].open[ACEUIAppLoader.page] || []).length, 0, "and the store now holds this session's list");
        ok(last(window.__log).indexOf("replayed on its list") >= 0, "the log says why: " + last(window.__log));
        eq(P.readLocal(W.OPEN_STORE_KEY).ops, undefined, "the changes, replayed, are not kept as changes any more");
        // a store that is newer is adopted as before
        const newer = { open: {}, at: Date.now() + 60000 }; newer.open[ACEUIAppLoader.page] = ["stale.a"];
        window.HUD.StoredData.layouts.default.elements[W.OPEN_HUD_ID] = newer;
        eq(W.adopt().join(","), "stale.a", "a newer store's list is adopted");
        clock.step(6016); eq(reopened, 1, "and the window comes back");
        W.close("stale.a");
        window.HUD = null;
    });

    /*
     * The five lines every app in this project opened with, and the three it closed with.
     * Two of them fail quietly when forgotten: without the per-frame panel.update a widget
     * never returns to where it was left, and without loop.stop an app switched off in the
     * app drawer keeps its frame loop for ever.
     */
    t("app: panel() places the widget, drives its frame loop and stops both in one call", function () {
        const root = document.createElement("div");
        const me = ACEUIAppLoader.app("lifecycle");
        const frames = [];
        let ui;

        root.id = "lifecycle";
        root.className = "panel";
        center.appendChild(root);
        window.HUD = makeHud({ hud_lifecycle: { fx: 0.25, fy: 0.5 } });

        ui = me.panel(root, function (now) { frames.push(now); });
        eq(root.style.visibility, "hidden", "hidden until it has been placed");

        clock.step(1000);
        eq(frames.length, 1, "the callback runs on every frame");
        eq(root.style.visibility, "", "and the panel was ticked, so its position restored");
        near(parseFloat(root.style.left), 0.25 * center.clientWidth, 2, "restored from the HUD store");
        ok(ui.panel, "the panel itself is there for an app that needs it");

        clock.step(1016);
        eq(frames.length, 2, "still running");
        eq(ui.stop(), true, "stop stops it");
        clock.step(1032);
        eq(frames.length, 2, "no frames after stop");
        eq(ui.stop(), false, "and stopping twice is harmless");

        mouse("mousedown", 10, 10, root);
        mouse("mousemove", 400, 400);
        mouse("mouseup", 400, 400);
        near(parseFloat(root.style.left), 0.25 * center.clientWidth, 2, "and its drag listeners went with it");

        window.HUD = undefined;
        root.parentNode.removeChild(root);
    });

        /*
         * No 720p, 4K, ultrawide or triple-screen rig is on a desk here, and the geometry is
         * pure arithmetic from the viewport, the stock's px-per-rem and the settings, so every
         * shape is walked through metrics() with the viewport given. The px per rem is the
         * stock formula (components.js resize()): clamp(10, 48, aspect > 1.77 ? min(W / 120,
         * H / 67.5) : W / 120).
         */
        t("drawer: the geometry holds on every screen shape, 720p to a spanned triple, on either side, with the triple and offset clamps", function () {
            const d = ACEUIAppLoader.drawer, S = ACEUIAppLoader.settings, A = d.DRAWER_APP;
            const stockRem = function (W, H) { const ar = W / H; return Math.min(48, Math.max(10, ar > 1.77 ? Math.min(W / 120, H / 67.5) : W / 120)); };
            const screens = [
                { name: "720p", W: 1280, H: 720 }, { name: "1080p", W: 1920, H: 1080 }, { name: "1440p", W: 2560, H: 1440 },
                { name: "4K", W: 3840, H: 2160 }, { name: "16:10", W: 1920, H: 1200 }, { name: "4:3", W: 1600, H: 1200 },
                { name: "ultrawide", W: 3440, H: 1440 }, { name: "32:9", W: 5120, H: 1440 },
                { name: "triple 1080p", W: 5760, H: 1080 }, { name: "triple 1440p", W: 7680, H: 1440 }, { name: "triple 4K", W: 11520, H: 2160 }
            ];
            const checkShape = function (s) {
                const v = { W: s.W, H: s.H, pxPerRem: stockRem(s.W, s.H) };
                const at = function (side, triple) {
                    const m = d.metrics(v);
                    const right = side === "right";
                    // the edge line the drawer uses: the whole pixel the panel is written at (second review, 2026-09-24)
                    const edge = right ? s.W - Math.round(m.offsetPx) : Math.round(m.offsetPx);
                    const where = s.name + " " + side + (triple ? " triple" : "");
                    near(m.zonePx, 2 * v.pxPerRem, 0.001, where + ": zone 2rem");
                    ok(m.zonePx >= 10 * 2 - 0.001, where + ": the zone is never under 20px (10px/rem floor)");
                    near(m.offsetPx, triple ? s.W / 3 : 0, 0.001, where + ": the edge is " + (triple ? "a third of the way in" : "the screen edge"));
                    ok(m.offsetPx <= s.W * d.OFFSET_MAX_FRACTION + 0.001, where + ": the edge stays in the near half");
                    ok(m.widthPx <= s.W / 2, where + ": the panel fits in half the screen (" + Math.round(m.widthPx) + "px)");
                    ok(m.H - m.topPx - m.bottomPx >= d.MIN_PANEL_HEIGHT_REM * v.pxPerRem - 0.001, where + ": the insets leave room");
                    // the zone: on the drawer's edge, one zone wide, on the drawer's side of the edge line
                    ok(d.inZone(right ? edge - 1 : edge + 1, s.H / 2, m), where + ": a pixel inside the edge is in the zone");
                    ok(d.inZone(right ? edge - m.zonePx : edge + m.zonePx, s.H / 2, m), where + ": the zone's inner limit is in");
                    ok(!d.inZone(right ? edge - m.zonePx - 1 : edge + m.zonePx + 1, s.H / 2, m), where + ": a pixel further is out");
                    ok(!d.inZone(right ? edge + 1 : edge - 1, s.H / 2, m), where + ": the far side of the edge line is out (a triple's side screen)");
                    ok(!d.inZone(right ? 1 : s.W - 1, s.H / 2, m), where + ": the opposite screen edge is out");
                    // the panel: from the edge line inwards, one width wide, between the insets
                    ok(d.inPanel(right ? edge - m.widthPx / 2 : edge + m.widthPx / 2, s.H / 2, m), where + ": the panel's middle is in the panel");
                    ok(!d.inPanel(right ? edge - m.widthPx - 1 : edge + m.widthPx + 1, s.H / 2, m), where + ": past the panel's inner edge is out");
                    ok(!d.inPanel(edge, m.topPx - 1, m) && !d.inPanel(edge, s.H - m.bottomPx + 1, m), where + ": above and below the insets is out");
                    if (triple) { near(edge, right ? s.W * 2 / 3 : s.W / 3, 0.5, where + ": the edge line is the centre screen's boundary, to the pixel"); }
                };
                ["right", "left"].forEach(function (side) {
                    S.set(A, "side", side);
                    S.set(A, "triple", false); at(side, false);
                    S.set(A, "triple", true); at(side, true);
                });
                // the offset on top of the triple third cannot push the edge line past the near half
                S.set(A, "offset", 60);
                ok(d.metrics(v).offsetPx <= s.W * d.OFFSET_MAX_FRACTION + 0.001, s.name + ": triple plus 60rem is clamped");
                S.set(A, "offset", 0); S.set(A, "triple", false); S.set(A, "side", "right");
            };
            screens.forEach(checkShape);
            // 4K at 32px/rem: 2rem is 64px; 720p at 10.67: 21px -- the same slice of each screen
            near(d.metrics({ W: 3840, H: 2160, pxPerRem: stockRem(3840, 2160) }).zonePx, 64, 0.01, "4K: 64px");
            near(d.metrics({ W: 1280, H: 720, pxPerRem: stockRem(1280, 720) }).zonePx, 21.33, 0.01, "720p: 21px");
            d.resetSettings();
        });

            d.state.visible = {}; d.state.developer = false; d.state.touched = false;
            d.state.touchedNames = {}; d.state.touchedDev = false;  // earlier cases flipped the developer switch
            d.setVisible("racy", false);                           // the player acts first
            window.HUD = makeHud(elements);                        // the store arrives
            d.adoptHudStore();
            eq(d.isVisible("racy"), false, "the flip wins");
            eq(d.isVisible("keepoff"), false, "another switch saved on disk is kept");
            eq(d.developerShown(), true, "and the developer switch on disk too");
            eq(P.readHud(d.HUD_ID).keepoff, false, "written back intact");
            eq(P.readHud(d.HUD_ID).racy, false, "with the flip");
            const junk = {};
            junk[d.HUD_ID] = "junk";
            junk[d.DEV_HUD_ID] = { on: "false" };
            window.HUD = makeHud(junk);
            d.state.visible = {}; d.state.developer = false; d.state.touched = false;
            d.adoptHudStore();
            eq(d.developerShown(), false, "a stored \"false\" is not on");
            eq(typeof d.state.visible, "object", "a stored string is not taken as the switch map");
            d.setVisible("junky", false);
            eq(d.isVisible("junky"), false, "switches still work");
            delete d.state.visible.junky; delete d.state.visible.racy; delete d.state.visible.keepoff;
            d.state.developer = false; d.state.touched = false;
            window.HUD = null;
        });

        t("drawer: a switch hides the app's own root element and remembers the choice", function () {
            const d = ACEUIAppLoader.drawer;
            let root = document.getElementById("alpha");
            if (!root) {
                root = document.createElement("div");
                root.id = "alpha";
                document.getElementById("center").appendChild(root);
            }

            eq(d.isVisible("alpha"), true, "on by default");
            d.toggleApp("alpha");
            eq(d.isVisible("alpha"), false, "switched off");
            eq(root.style.display, "none", "the app's root is hidden");
            eq(ACEUIAppLoader.persist.readLocal(d.STORE_KEY).alpha, false, "and the choice is persisted");

            d.toggleApp("alpha");
            eq(root.style.display, "", "switched back on, the app's own CSS decides again");
            eq(d.isVisible("alpha"), true);
        });

        t("drawer: a switched-off app is hidden the instant its root is created, not when the drawer builds", function () {
            const d = ACEUIAppLoader.drawer;
            /* The drawer builds on ready(), which fires only after EVERY app has loaded, so
               anything that waits for build() leaves a switched-off app visible for that
               whole time -- about a second with a big app in the queue, seen in game as the
               app flashing on and then vanishing again after a pause-menu reload. */
            d.setVisible("flashy", false);

            const root = document.createElement("div");
            root.id = "flashy";
            document.getElementById("center").appendChild(root);
            eq(root.style.display, "", "just created, nothing has hidden it yet");

            d.applyStored("flashy");
            eq(root.style.display, "none", "hidden immediately, without build() having run for it");

            d.setVisible("flashy", true);
            eq(root.style.display, "", "and switching it back on restores it");
            root.parentNode.removeChild(root);
        });

        t("drawer: switches survive a game restart, because they go to the HUD store too", function () {
            const d = ACEUIAppLoader.drawer;
            const P = ACEUIAppLoader.persist;
            window.HUD = makeHud({});     // the earlier panel cases leave it null
            /* localStorage dies with the game; the stock HUD layout container is the one
               the game writes to disk. Saving only to localStorage meant every app came
               back enabled after a restart. */
            d.setVisible("restarty", false);

            const local = P.readLocal(d.STORE_KEY);
            eq(local.restarty, false, "localStorage written (fast path for Escape/resume)");
            const hud = P.readHud(d.HUD_ID);
            ok(hud, "the HUD layout store took it as well");
            eq(hud.restarty, false, "and that is the copy that reaches disk");

            /* now act out a restart: localStorage gone, HUD store restored from disk */
            P.removeLocal(d.STORE_KEY);
            d.state.visible = {};
            d.state.touched = false;
            eq(d.isVisible("restarty"), true, "with nothing loaded it would default back to on");

            d.adoptHudStore();
            eq(d.isVisible("restarty"), false, "adopted from the HUD store");
            eq(P.readLocal(d.STORE_KEY).restarty, false, "and mirrored back so the next reload is instant");
            window.HUD = null;
        });

        /* The switch is written to the HUD store, which is the only store that survives a
           game restart -- but it was never read back from it: localStorage dies with the
           game, and the HUD store is not there yet when the library loads, so a player who
           turned the developer apps on found them off again every launch. */
        t("drawer: the developer switch survives a game restart too", function () {
            const d = ACEUIAppLoader.drawer;
            const P = ACEUIAppLoader.persist;

            window.HUD = makeHud({});
            d.setDeveloper(true);
            eq(P.readHud(d.DEV_HUD_ID).on, true, "it reaches the store the game writes to disk");

            // a restart: localStorage gone, the HUD store restored from disk, nothing touched
            P.removeLocal(d.DEV_STORE_KEY);
            d.state.developer = false;
            d.state.touched = false;
            eq(d.developerShown(), false, "with nothing loaded it defaults back to off");

            d.adoptHudStore();
            eq(d.developerShown(), true, "adopted from the HUD store");
            eq(P.readLocal(d.DEV_STORE_KEY).on, true, "and mirrored back for the next HUD reload");

            d.setDeveloper(false);
            d.state.touched = false;
            window.HUD = null;
        });

        t("drawer: a switch flipped before the HUD store arrives wins, and is written to it", function () {
            const d = ACEUIAppLoader.drawer;
            const P = ACEUIAppLoader.persist;

            window.HUD = makeHud({ hud_acedrawer: { racy: true } });   // the copy from disk
            d.setVisible("racy", false);          // the user acts first
            d.state.touched = true;
            d.adoptHudStore();                    // the store turns up afterwards
            eq(d.isVisible("racy"), false, "the newer choice wins over what was on disk");

            /* and it has to reach that store: writeHud fails while it does not exist, so a
               switch flipped early used to live in localStorage only -- which dies with
               the game, losing the choice at the next launch. */
            eq(P.readHud(d.HUD_ID).racy, false, "flushed to the store the game writes to disk");
            window.HUD = null;
        });

        t("drawer: switching an app off stops it, not just hides it", function () {
            const d = ACEUIAppLoader.drawer;
            /* Hiding the root left the app's key handlers, frame loop and sounds running:
               DOOM still answered Insert and played music while "disabled". */
            const root = document.createElement("div");
            root.id = "lively";
            document.getElementById("center").appendChild(root);

            let attached = 0, detached = 0;
            const entry = { name: "lively", info: { title: "Lively" }, status: "loaded" };
            ACEUIAppLoader.loader.apps.push(entry);
            entry.attach = function () { attached += 1; return { live: true }; };
            entry.detach = function () { detached += 1; };
            entry.instance = entry.attach(root);
            root.setAttribute("data-mounted", "");
            eq(attached, 1, "running to begin with");

            d.setVisible("lively", false);
            eq(detached, 1, "its own detach was called");
            eq(entry.instance, null, "and the instance released");
            eq(root.style.display, "none", "the root is hidden too");
            eq(root.hasAttribute("data-mounted"), false, "no longer marked mounted");

            d.setVisible("lively", true);
            eq(attached, 2, "switching back on restarts it");
            ok(entry.instance, "with a fresh instance");
            eq(root.style.display, "", "and visible again");

            root.parentNode.removeChild(root);
            ACEUIAppLoader.loader.apps.splice(ACEUIAppLoader.loader.apps.indexOf(entry), 1);
        });

        t("drawer: an app that gave the loader no detach is still only hidden", function () {
            const d = ACEUIAppLoader.drawer;
            const root = document.createElement("div");
            root.id = "stubborn";
            document.getElementById("center").appendChild(root);

            const entry = { name: "stubborn", info: {}, status: "loaded", instance: {} };
            ACEUIAppLoader.loader.apps.push(entry);

            eq(ACEUIAppLoader.loader.deactivate("stubborn"), false, "nothing to stop it with");
            d.setVisible("stubborn", false);
            eq(root.style.display, "none", "so hiding is all the drawer can do");

            root.parentNode.removeChild(root);
            ACEUIAppLoader.loader.apps.splice(ACEUIAppLoader.loader.apps.indexOf(entry), 1);
        });

        /*
         * The drawer used to offer two ways in: a pane that unfolded inside it, and a
         * window of the app's own. The pane pushed every row below it down the list, so
         * with a dozen apps it was unusable; it is gone, and this is the one way in.
         */
        t("drawer: the OPTIONS button opens what the app registered, and a throwing one does not take the drawer down", function () {
            const d = ACEUIAppLoader.drawer;
            const app = d.state.apps.filter(function (a) { return a.name === "alpha"; })[0];
            const bad = d.state.apps.filter(function (a) { return a.name === "beta"; })[0];
            let opened = 0;

            eq(app.gear.style.display, "none", "nothing registered, nothing offered");
            d.registerOpener("alpha", function () { opened += 1; });
            eq(app.gear.style.display, "", "registering reveals it");

            app.gear.dispatchEvent(new MouseEvent("click", { bubbles: true }));
            eq(opened, 1, "clicking it opens what the app registered");
            eq(d.isVisible("alpha"), true, "and does not toggle the app off");

            d.registerOpener("beta", function () { throw new Error("boom"); });
            bad.gear.dispatchEvent(new MouseEvent("click", { bubbles: true }));
            eq(d.state.apps.length, 2, "a throwing opener leaves the drawer intact");
            ok(last(window.__log).indexOf("beta options failed: Error: boom") >= 0, "and says so in the log");
        });

        t("drawer: registerOptions is gone; an app opens its own window instead", function () {
            eq(typeof ACEUIAppLoader.drawer.registerOptions, "undefined", "one way in, not two");
            eq(typeof ACEUIAppLoader.input.releaseAll, "undefined", "and release() has no alias");
        });

        waitFor(function () { return seen !== null; }, function () {
            t("loader: stock handlers get the list without our markers", function () {
                ok(seen, "stock handler ran");
                eq(seen.filenames.join(","), "MyLowSettings");
                eq(seen.response, "OK");
                eq(ACEUIAppLoader.loader.apps.length, 3, "the loader's own handler was cleared after discovery: gadget, alpha and beta, not a second round");
                handle.clear();
                eq((window.__engine.handlers["SettingsResponseVideoPresetList"] || []).length, 0, "clear() still works through the wrapper");
            });

            // The retry: the fake engine swallows the next request, as a stock engine.off(name)
            // clearing our handler or a late engine would, and answers the one after.
            const L = ACEUIAppLoader.loader;
            const asked = window.__engine.triggered.length;
            let found = null;
            window.engine.mute = 1;
            L.discover(function (names, source) { found = { names: names, source: source }; });
            waitFor(function () { return found !== null; }, function () {
                t("loader: a silent first answer is asked again before the installed apps are given up on", function () {
                    ok(found, "discovery finished");
                    eq(found.source, "presets", "the second answer counted");
                    eq(found.names.join(","), "alpha,beta");
                    ok(window.__log.some(function (l) { return l === "[ACEUIAppLoader] no preset list answer in " + L.PRESET_TIMEOUT_MS + " ms; asking again"; }), "it said it was asking again");
                    eq(window.__engine.triggered.slice(asked).filter(function (x) { return x[1] === L.PRESET_REQUEST; }).length, 2, "two requests went out");
                    eq((window.__engine.handlers["SettingsResponseVideoPresetList"] || []).length, 0, "and no handler was left behind");
                });

                // The version check waits for the model to be filled in rather than reading it once.
                const hadBuilt = ACEUIAppLoader.builtFor;
                ACEUIAppLoader.builtFor = "0.9.1+release.6";
                delete window.ModelUIState;
                const early = L.watchGameVersion(Date.now() + 3000);
                window.setTimeout(function () { window.ModelUIState = { game_version: "0.9.3" }; }, 300);
                const noticed = function () {
                    return window.__log.some(function (l) { return l.indexOf("built for game 0.9.1+release.6 but running on 0.9.3") > 0; });
                };
                waitFor(noticed, function () {
                    t("loader: the version check waits for the game to publish its version instead of reading it once", function () {
                        eq(early, false, "nothing to compare yet: the model is not filled in at DOMContentLoaded");
                        ok(noticed(), "and it spoke once the version arrived");
                        ACEUIAppLoader.builtFor = hadBuilt;
                        delete window.ModelUIState;
                    });
                    finish();
                }, Date.now() + 4000);
            }, Date.now() + L.PRESET_TIMEOUT_MS + L.PRESET_RETRY_MS + 2000);
        }, Date.now() + 2000);
    });
});
</script>
</body>
</html>
