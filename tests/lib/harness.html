<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ACEUIModLoader library tests</title>
<style>
  body { margin: 0; background: #222; color: #ddd; font: 12px monospace; }
  /* stand-in for the game's HUD container */
  .absolutecenter { position: relative; width: 1600px; height: 900px; overflow: hidden; }
  .panel { position: absolute; left: 2rem; bottom: 2rem; width: 200px; height: 100px; background: #444; }
  #results { white-space: pre; }
</style>
<script src="doubles.js"></script>
<script>
// Fake Cohtml engine. Answers the video preset list (two markers, one real preset,
// one malformed marker) a tick after being asked, like the game does, so discovery
// and the stock-handler filter can be tested. Records every trigger.
window.__engine = { handlers: {}, triggered: [] };
window.engine = {
    on: function (name, callback, context) {
        const list = window.__engine.handlers[name] = window.__engine.handlers[name] || [];
        const entry = { cb: callback, ctx: context };
        list.push(entry);
        return { clear: function () { const i = list.indexOf(entry); if (i >= 0) { list.splice(i, 1); } } };
    },
    trigger: function (name, command, data) {
        window.__engine.triggered.push([name, command, data]);
        if (command !== "SettingsRequestVideoPresetList") { return; }
        window.setTimeout(function () {
            const response = { __Type: "SettingsResponseVideoPresetList", response: "OK",
                filenames: ["ACEUIModLoaderMods-beta", "MyLowSettings", "ACEUIModLoaderMods-alpha", "ACEUIModLoaderMods-"] };
            (window.__engine.handlers["SettingsResponseVideoPresetList"] || []).slice().forEach(function (e) { e.cb.call(e.ctx || window.engine, response); });
        }, 0);
    },
    whenReady: Promise.resolve()
};
</script>
<!-- the library exactly as build_loader.py appends it to cohtml.js, same order -->
<script src="lib.js"></script>
</head>
<body>
<div class="absolutecenter" id="center"></div>
<pre id="results"></pre>
<div id="done" hidden></div>

<script>
// Runs on DOMContentLoaded: the loader registered its own listener first, so its
// boot line is logged before the cases run, exactly as on a game page.
document.addEventListener("DOMContentLoaded", function () {
    const H = window.__harness;
    const t = H.t, eq = H.eq, ok = H.ok, near = H.near;
    const last = function (arr) { return arr[arr.length - 1]; };

    const clock = window.__clock;
    const center = document.getElementById("center");
    const mouse = function (type, x, y, target) {
        (target || window).dispatchEvent(new MouseEvent(type, { clientX: x, clientY: y, bubbles: true }));
    };
    const makeHud = function (elements) {
        const hud = { currentLayout: "default", StoredData: { lastLayout: "default", layouts: { default: { elements: elements || {} } } } };
        hud.elementModified = function (id, props) { hud.StoredData.layouts.default.elements[id] = props; };
        return hud;
    };
    const makePanel = function (opts) {
        const root = document.createElement("div");
        root.className = "panel";
        center.appendChild(root);
        const panel = ACEUIModLoader.panel.attach(root, Object.assign({ hudId: "hud_test", storageKey: "acetest.pos", log: function () {} }, opts || {}));
        return { root: root, panel: panel };
    };
    const HUD_ID = "hud_test", KEY = "acetest.pos", WAIT = ACEUIModLoader.panel.RESTORE_WAIT_MS;

    // ---- core ---------------------------------------------------------------------------

    t("core: namespace, version, page, window property", function () {
        eq(typeof ACEUIModLoader, "object"); eq(window.ACEUIModLoader, ACEUIModLoader, "window.ACEUIModLoader");
        ok(/^\d+\.\d+\.\d+$/.test(ACEUIModLoader.VERSION), "semver"); eq(ACEUIModLoader.page, "harness.html", "page");
        eq(ACEUIModLoader.LOG_PREFIX, "[ACEUIModLoader]"); eq(ACEUIModLoader.HUD_HIDDEN_CLASS, "hide-hud");
        ["console", "persist", "panel", "loop", "loader"].forEach(function (ns) { eq(typeof ACEUIModLoader[ns], "object", ns); });
    });

    t("core: helpers", function () {
        eq(ACEUIModLoader.clamp(5, 0, 1), 1); eq(ACEUIModLoader.clamp(-1, 0, 1), 0); eq(ACEUIModLoader.clamp(0.5, 0, 1), 0.5);
        eq(ACEUIModLoader.el("div", "a", { "data-x": 1 }) + ACEUIModLoader.close("div"), '<div class="a" data-x="1"></div>');
        eq(ACEUIModLoader.percentText(0.499), "50%"); eq(ACEUIModLoader.percentText(0), "0%");
        eq(ACEUIModLoader.toArray(document.querySelectorAll("div")).length >= 1, true);
        eq(ACEUIModLoader.hudHidden(), false); document.body.classList.add("hide-hud"); eq(ACEUIModLoader.hudHidden(), true); document.body.classList.remove("hide-hud");
        ACEUIModLoader.logger("[T]")("hi"); eq(last(window.__log), "[T] hi", "logger prefix"); ACEUIModLoader.log("x"); eq(last(window.__log), "[ACEUIModLoader] x");
        const outer = document.createElement("div"), inner = document.createElement("span"); inner.setAttribute("data-nodrag", ""); outer.appendChild(inner);
        const deep = document.createElement("b"); inner.appendChild(deep);
        eq(ACEUIModLoader.closestWithAttribute(deep, "data-nodrag", outer), inner, "closest finds ancestor"); eq(ACEUIModLoader.closestWithAttribute(outer, "data-nodrag", outer), null, "stops at root");
    });

    // ---- console ------------------------------------------------------------------------

    t("console: hook captures levels and text, still calls the original", function () {
        ACEUIModLoader.console.clear();
        console.log("hello", 42, true, null);
        console.warn("careful");
        console.error(new Error("boom"));
        const e = ACEUIModLoader.console.entries();
        eq(e.length, 3, "entries"); eq(e[0].level, "log"); eq(e[0].text, "hello 42 true null"); eq(e[1].level, "warn"); eq(e[1].text, "careful");
        eq(e[2].level, "error"); eq(e[2].text, "Error: boom");
        eq(last(window.__log).indexOf("hello 42 true"), 0, "original console.log reached"); eq(window.__warn.length >= 2, true, "original warn/error reached");
        ok(e[0].seq < e[1].seq && e[1].seq < e[2].seq, "seq increases"); eq(typeof e[0].t, "number");
    });

    t("console: objects are formatted compactly and bounded", function () {
        ACEUIModLoader.console.clear();
        console.log({ a: 1, b: "x", c: [1, 2, { d: 3 }], f: function named() {} });
        eq(ACEUIModLoader.console.entries()[0].text, '{a: 1, b: "x", c: [1, 2, {...}], f: [function named]}');
        const big = {}; let i; for (i = 0; i < 30; i += 1) { big["k" + i] = i; }
        console.log(big);
        ok(ACEUIModLoader.console.entries()[1].text.indexOf("...}") > 0, "key cap");
        console.log("x".repeat(1000));
        eq(ACEUIModLoader.console.entries()[2].text.length, 403, "text cap");
        eq(ACEUIModLoader.console.format([1, [2, [3]]]), "[1, [2, [...]]]", "format export");
    });

    t("console: ring buffer keeps the last MAX_ENTRIES", function () {
        ACEUIModLoader.console.clear();
        let i; for (i = 0; i < ACEUIModLoader.console.MAX_ENTRIES + 10; i += 1) { console.log("n" + i); }
        eq(ACEUIModLoader.console.entries().length, ACEUIModLoader.console.MAX_ENTRIES);
        eq(ACEUIModLoader.console.entries()[0].text, "n10", "oldest dropped");
    });

    t("console: subscribe / unsubscribe / capture / errors", function () {
        ACEUIModLoader.console.clear();
        const seen = [];
        const off = ACEUIModLoader.console.subscribe(function (entry) { seen.push(entry.level + ":" + entry.text); });
        eq(ACEUIModLoader.console.listenerCount(), 1);
        console.log("a"); ACEUIModLoader.console.capture("input", "> 1+1");
        eq(seen.join("|"), "log:a|input:> 1+1");
        eq(window.__log.indexOf("> 1+1"), -1, "capture does not reach console");
        window.dispatchEvent(new ErrorEvent("error", { message: "kaboom", filename: "x.js", lineno: 7 }));
        eq(last(seen), "error:uncaught: kaboom at x.js:7");
        off(); eq(ACEUIModLoader.console.listenerCount(), 0);
        console.log("b"); eq(seen.length, 3, "no notification after unsubscribe");
        // a listener that logs must not recurse
        const off2 = ACEUIModLoader.console.subscribe(function () { console.log("from listener"); });
        console.log("trigger"); off2();
        eq(last(ACEUIModLoader.console.entries()).text, "from listener", "stored once, no infinite loop");
    });

    // ---- persist -------------------------------------------------------------------------

    t("persist: local round trip, hud store when present", function () {
        window.HUD = null; localStorage.clear();
        eq(ACEUIModLoader.persist.hudAvailable(), false); eq(ACEUIModLoader.persist.readHud("hud_x"), null);
        eq(ACEUIModLoader.persist.writeHud("hud_x", { a: 1 }), false, "no HUD object");
        eq(ACEUIModLoader.persist.writeLocal("k", { a: 1 }), true); eq(ACEUIModLoader.persist.readLocal("k").a, 1);
        ACEUIModLoader.persist.removeLocal("k"); eq(ACEUIModLoader.persist.readLocal("k"), null);
        eq(ACEUIModLoader.persist.save("hud_x", "k", { b: 2 }).join(","), "localStorage");
        window.HUD = makeHud({});
        eq(ACEUIModLoader.persist.hudAvailable(), true);
        eq(ACEUIModLoader.persist.save("hud_x", "k", { b: 3 }).join(","), "hud layout,localStorage");
        eq(ACEUIModLoader.persist.readHud("hud_x").b, 3); eq(ACEUIModLoader.persist.readLocal("k").b, 3);
        window.HUD = null; localStorage.clear();
    });

    // ---- panel ------------------------------------------------------------------------------

    t("input: capture sets both levers, release clears them", function () {
        const calls = [];
        window.ksUI = { menuState: {
            toggleKeyboardInput: function (on) { calls.push("chat:" + on); },
            ignoreInputActions: function (on) { calls.push("actions:" + on); }
        } };

        ok(ACEUIModLoader.input.available(), "the engine offers the levers");
        ACEUIModLoader.input.capture("one");
        eq(calls.join(" "), "chat:true actions:true", "both levers go up");
        /* is_chat_active alone left the arrow keys moving the seat, which is why the
           second lever has to be here too */
        ok(ACEUIModLoader.input.isCaptured(), "held");

        calls.length = 0;
        ACEUIModLoader.input.release("one");
        eq(calls.join(" "), "chat:false actions:false", "and both come down");
        eq(ACEUIModLoader.input.isCaptured(), false, "released");
    });

    t("input: two holders share it; the flags drop only when the last lets go", function () {
        const calls = [];
        window.ksUI = { menuState: {
            toggleKeyboardInput: function (on) { calls.push(on); },
            ignoreInputActions: function () {}
        } };

        /* the console holds it while typing, DOOM while it is open: if the console
           released on blur it would yank the keyboard out from under DOOM */
        ACEUIModLoader.input.capture("devconsole");
        ACEUIModLoader.input.capture("doom");
        eq(calls.length, 1, "the engine is told once, not twice");
        eq(ACEUIModLoader.input.holders().length, 2, "both are holding");

        calls.length = 0;
        ACEUIModLoader.input.release("devconsole");
        eq(calls.length, 0, "one letting go changes nothing");
        ok(ACEUIModLoader.input.isCaptured(), "still held by the other");

        ACEUIModLoader.input.release("doom");
        eq(calls.join(""), "false", "released only when the last holder lets go");
        eq(ACEUIModLoader.input.isCaptured(), false);
    });

    t("input: repeated capture by one owner counts once, and releasing an unknown owner is harmless", function () {
        const calls = [];
        window.ksUI = { menuState: { toggleKeyboardInput: function (on) { calls.push(on); } } };

        ACEUIModLoader.input.capture("same");
        ACEUIModLoader.input.capture("same");
        eq(ACEUIModLoader.input.holders().length, 1, "counted once");
        ACEUIModLoader.input.release("nobody");
        ok(ACEUIModLoader.input.isCaptured(), "releasing a stranger does not drop it");
        ACEUIModLoader.input.release("same");
        eq(ACEUIModLoader.input.isCaptured(), false, "its own release does");
    });

    t("input: bindFocus holds it exactly while the element has focus, and unbinding releases", function () {
        window.ksUI = { menuState: { toggleKeyboardInput: function () {}, ignoreInputActions: function () {} } };
        const box = document.createElement("input");
        document.getElementById("center").appendChild(box);

        const unbind = ACEUIModLoader.input.bindFocus(box, "boxy");
        box.dispatchEvent(new Event("focus"));
        ok(ACEUIModLoader.input.isCaptured(), "held on focus");
        box.dispatchEvent(new Event("blur"));
        eq(ACEUIModLoader.input.isCaptured(), false, "released on blur");

        box.dispatchEvent(new Event("focus"));
        ok(ACEUIModLoader.input.isCaptured(), "held again");
        unbind();
        eq(ACEUIModLoader.input.isCaptured(), false, "unbinding releases even while focused");
        box.dispatchEvent(new Event("focus"));
        eq(ACEUIModLoader.input.isCaptured(), false, "and the listeners are gone");

        box.remove();
    });

    t("input: bindClickFocus takes the keyboard on a click inside and gives it back on a click outside", function () {
        window.ksUI = { menuState: { toggleKeyboardInput: function () {}, ignoreInputActions: function () {} } };
        const panel = document.createElement("div");
        const inner = document.createElement("span");
        const elsewhere = document.createElement("div");
        panel.appendChild(inner);
        document.getElementById("center").appendChild(panel);
        document.getElementById("center").appendChild(elsewhere);

        /* holding the keyboard for as long as a panel is open would mean never being able
           to leave it open and drive; click-to-focus is what makes coexisting possible */
        const unbind = ACEUIModLoader.input.bindClickFocus(panel, "panelly");
        eq(ACEUIModLoader.input.isCaptured(), false, "binding alone takes nothing");

        inner.dispatchEvent(new MouseEvent("mousedown", { bubbles: true }));
        ok(ACEUIModLoader.input.isCaptured(), "a click on a descendant counts as inside");

        elsewhere.dispatchEvent(new MouseEvent("mousedown", { bubbles: true }));
        eq(ACEUIModLoader.input.isCaptured(), false, "a click outside gives it back");

        panel.dispatchEvent(new MouseEvent("mousedown", { bubbles: true }));
        ok(ACEUIModLoader.input.isCaptured(), "and clicking it again takes it back");

        unbind();
        eq(ACEUIModLoader.input.isCaptured(), false, "unbinding releases");
        panel.dispatchEvent(new MouseEvent("mousedown", { bubbles: true }));
        eq(ACEUIModLoader.input.isCaptured(), false, "and stops listening");

        eq(ACEUIModLoader.input.within(panel, inner), true, "within() walks up the tree");
        eq(ACEUIModLoader.input.within(panel, elsewhere), false);

        panel.remove();
        elsewhere.remove();
    });

    t("input: Escape always takes the keyboard back, whoever is holding it", function () {
        const calls = [];
        window.ksUI = { menuState: {
            toggleKeyboardInput: function (on) { calls.push(on); },
            ignoreInputActions: function () {}
        } };

        /* Escape is itself a bound gameplay action, so suppressing actions suppressed the
           pause menu: a stuck capture left the game with no way to open it at all. */
        ACEUIModLoader.input.capture("clingy");
        ACEUIModLoader.input.capture("alsoclingy");
        ok(ACEUIModLoader.input.isCaptured(), "two holders");

        calls.length = 0;
        window.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
        eq(ACEUIModLoader.input.isCaptured(), false, "Escape drops every holder");
        eq(ACEUIModLoader.input.holders().length, 0, "nobody is left holding");
        eq(calls.join(""), "false", "and the engine is told");

        /* the legacy keyCode path too, since that is what the engine reports */
        ACEUIModLoader.input.capture("clingy");
        window.dispatchEvent(new KeyboardEvent("keydown", { keyCode: 27, bubbles: true }));
        eq(ACEUIModLoader.input.isCaptured(), false, "keyCode 27 works as well");
    });

    t("input: releaseEverything clears the engine even when nothing is recorded as held", function () {
        const calls = [];
        window.ksUI = { menuState: {
            toggleKeyboardInput: function (on) { calls.push(on); },
            ignoreInputActions: function (on) { calls.push(on); }
        } };

        /* the flags live in the game's menu state and survive a HUD reload, so a fresh
           page has to be able to clear a capture it never made */
        ACEUIModLoader.input.state.owners = {};
        ACEUIModLoader.input.state.count = 0;
        ACEUIModLoader.input.state.applied = true;      // as if a previous page left it on

        calls.length = 0;
        ok(ACEUIModLoader.input.releaseEverything("test"), "it writes");
        eq(calls.join(" "), "false false", "both levers cleared");
        eq(ACEUIModLoader.input.isCaptured(), false);
    });

    t("input: a missed blur does not strand the capture -- a click elsewhere releases too", function () {
        window.ksUI = { menuState: { toggleKeyboardInput: function () {}, ignoreInputActions: function () {} } };
        const box = document.createElement("input");
        const elsewhere = document.createElement("div");
        document.getElementById("center").appendChild(box);
        document.getElementById("center").appendChild(elsewhere);

        const unbind = ACEUIModLoader.input.bindFocus(box, "typer");
        box.dispatchEvent(new Event("focus"));
        ok(ACEUIModLoader.input.isCaptured(), "held while focused");

        /* no blur is fired here on purpose: that is the case that stranded it in game */
        elsewhere.dispatchEvent(new MouseEvent("mousedown", { bubbles: true }));
        eq(ACEUIModLoader.input.isCaptured(), false, "a click elsewhere releases it anyway");

        unbind();
        box.remove();
        elsewhere.remove();
    });

    t("input: the player's own menu binding releases it, whatever key they put it on", function () {
        window.ksUI = { menuState: { toggleKeyboardInput: function () {}, ignoreInputActions: function () {} } };

        /* A player can rebind pause off Escape, so releasing only on the Escape key would
           strand exactly the players who customised their controls. The engine reports
           bound actions by name, which is the same whatever key produced them. */
        ACEUIModLoader.input.capture("holder");
        ACEUIModLoader.input.onAction({ action: "InputAction_UI_Menu" });
        eq(ACEUIModLoader.input.isCaptured(), false, "the menu action releases it");

        ACEUIModLoader.input.capture("holder");
        ACEUIModLoader.input.onAction({ action: "InputAction_UI_Cancel" });
        eq(ACEUIModLoader.input.isCaptured(), false, "so does cancel");

        ACEUIModLoader.input.capture("holder");
        ACEUIModLoader.input.onAction({ action: "InputAction_Car_Headlights" });
        ok(ACEUIModLoader.input.isCaptured(), "an unrelated action does not");
        ACEUIModLoader.input.onAction({});
        ok(ACEUIModLoader.input.isCaptured(), "nor does a malformed one");
        ACEUIModLoader.input.releaseEverything("cleanup");
    });

    t("input: losing window focus releases it, so alt-tab cannot strand the game", function () {
        window.ksUI = { menuState: { toggleKeyboardInput: function () {}, ignoreInputActions: function () {} } };
        ACEUIModLoader.input.capture("holder");
        window.dispatchEvent(new Event("blur"));
        eq(ACEUIModLoader.input.isCaptured(), false, "released on alt-tab");
    });

    t("input: outside the game there is nothing to capture, and it says so", function () {
        delete window.ksUI;
        eq(ACEUIModLoader.input.available(), false, "no levers");
        ACEUIModLoader.input.capture("nowhere");
        ACEUIModLoader.input.release("nowhere");
        eq(ACEUIModLoader.input.isCaptured(), false, "and nothing is left holding");
    });

    t("panel: attach hides until placed; drag moves, clamps and saves fractions", function () {
        window.HUD = null; localStorage.clear();
        const p = makePanel(); const root = p.root;
        eq(root.style.visibility, "hidden", "hidden while positioning");
        root.style.left = "100px"; root.style.top = "100px"; root.style.bottom = "auto";
        const r = root.getBoundingClientRect();
        mouse("mousedown", r.left + 10, r.top + 10, root);
        ok(root.classList.contains("dragging"), "dragging class");
        mouse("mousemove", r.left + 210, r.top + 60);
        eq(root.style.left, "300px", "left"); eq(root.style.top, "150px", "top"); eq(root.style.right, "auto", "right reset");
        mouse("mousemove", 99999, 99999);
        const c = center.getBoundingClientRect();
        eq(parseInt(root.style.left, 10), Math.round(c.width - root.offsetWidth), "clamped right");
        eq(parseInt(root.style.top, 10), Math.round(c.height - root.offsetHeight), "clamped bottom");
        mouse("mousemove", -99999, -99999); eq(root.style.left, "0px"); eq(root.style.top, "0px");
        mouse("mousemove", r.left + 410, r.top + 260); mouse("mouseup", 0, 0);
        ok(!root.classList.contains("dragging"));
        const saved = JSON.parse(localStorage.getItem(KEY));
        near(saved.fx, 500 / c.width, 0.001, "fx"); near(saved.fy, 350 / c.height, 0.001, "fy"); eq(saved.x, "500px"); eq(saved.y, "350px");
        ACEUIModLoader.panel.detach(p.panel); root.remove();
    });

    t("panel: data-nodrag descendants do not start a drag; onSaved fires with the HUD store written", function () {
        window.HUD = makeHud(); localStorage.clear();
        let savedPos = null;
        const p = makePanel({ onSaved: function (pos) { savedPos = pos; } }); const root = p.root;
        const input = document.createElement("input"); input.setAttribute("data-nodrag", ""); root.appendChild(input);
        root.style.left = "100px"; root.style.top = "100px"; root.style.bottom = "auto";
        mouse("mousedown", 105, 105, input);
        ok(!root.classList.contains("dragging"), "input must not start a drag");
        mouse("mousemove", 400, 400); eq(root.style.left, "100px", "did not move");
        mouse("mousedown", 105, 105, root); mouse("mousemove", 125, 115); mouse("mouseup", 0, 0);
        const entry = window.HUD.StoredData.layouts.default.elements[HUD_ID];
        ok(entry, "HUD store entry"); eq(entry.x, "120px"); eq(entry.y, "110px"); ok(savedPos && savedPos.x === "120px", "onSaved");
        ACEUIModLoader.panel.detach(p.panel); root.remove(); window.HUD = null;
    });

    t("panel: localStorage position applied synchronously at attach, HUD store keeps the last word", function () {
        window.HUD = null; localStorage.setItem(KEY, JSON.stringify({ fx: 0.2, fy: 0.3 }));
        const p = makePanel(); const c = center.getBoundingClientRect();
        eq(p.root.style.left, Math.round(0.2 * c.width) + "px", "placed immediately"); eq(p.root.style.visibility, "", "visible right away");
        ok(!p.panel.restored, "not settled yet");
        window.HUD = makeHud({}); window.HUD.StoredData.layouts.default.elements[HUD_ID] = { fx: 0.5, fy: 0.5 };
        ACEUIModLoader.panel.update(p.panel, 1000);
        eq(p.root.style.left, Math.round(0.5 * c.width) + "px", "HUD store wins"); ok(p.panel.restored);
        ACEUIModLoader.panel.detach(p.panel); p.root.remove(); localStorage.clear(); window.HUD = null;
    });

    t("panel: nothing stored: hidden until the HUD store was consulted, then default", function () {
        window.HUD = null; localStorage.clear();
        const p = makePanel();
        eq(p.root.style.visibility, "hidden"); eq(p.root.style.left, "", "nothing applied");
        ACEUIModLoader.panel.update(p.panel, 1000); eq(p.panel.restored, false, "waiting for HUD");
        window.HUD = makeHud({}); ACEUIModLoader.panel.update(p.panel, 1016);
        eq(p.root.style.left, "", "stylesheet default kept"); ok(p.panel.restored); eq(p.root.style.visibility, "", "shown");
        ACEUIModLoader.panel.detach(p.panel); p.root.remove(); window.HUD = null;
    });

    t("panel: no HUD object at all: localStorage fallback after the wait window", function () {
        window.HUD = null; localStorage.clear();
        const p = makePanel();
        localStorage.setItem(KEY, JSON.stringify({ fx: 0.3, fy: 0.4 }));   // saved later in the session
        ACEUIModLoader.panel.update(p.panel, 5000); ACEUIModLoader.panel.update(p.panel, 5000 + WAIT - 1);
        eq(p.root.style.left, "", "not yet"); ACEUIModLoader.panel.update(p.panel, 5000 + WAIT);
        const c = center.getBoundingClientRect(); eq(p.root.style.left, Math.round(0.3 * c.width) + "px", "fallback applied"); ok(p.panel.restored);
        ACEUIModLoader.panel.detach(p.panel); p.root.remove(); localStorage.clear();
    });

    t("panel: legacy/invalid stored positions are ignored; zero-size parent defers", function () {
        window.HUD = makeHud({}); localStorage.setItem(KEY, JSON.stringify({ left: "5px" }));
        const p = makePanel(); eq(p.root.style.left, "", "nothing applied synchronously");
        ACEUIModLoader.panel.update(p.panel, 100); eq(p.root.style.left, ""); ok(p.panel.restored, "gave up cleanly");
        ACEUIModLoader.panel.detach(p.panel); p.root.remove(); localStorage.clear();
        window.HUD.StoredData.layouts.default.elements[HUD_ID] = { fx: 0.5, fy: 0.5 };
        const hidden = document.createElement("div"); hidden.className = "absolutecenter"; hidden.style.display = "none"; document.body.appendChild(hidden);
        const root = document.createElement("div"); root.className = "panel"; hidden.appendChild(root);
        const panel = ACEUIModLoader.panel.attach(root, { hudId: HUD_ID, storageKey: KEY, log: function () {} });
        ACEUIModLoader.panel.update(panel, 200); ACEUIModLoader.panel.update(panel, 200 + WAIT + 100);
        eq(root.style.left, "", "nothing while the container has no size"); ok(!panel.restored);
        hidden.style.display = "block"; ACEUIModLoader.panel.update(panel, 200 + WAIT + 200);
        eq(root.style.left, Math.round(0.5 * hidden.getBoundingClientRect().width) + "px", "applied once laid out"); ok(panel.restored);
        ACEUIModLoader.panel.detach(panel); hidden.remove(); window.HUD = null;
    });

    t("panel: a click without movement saves nothing", function () {
        window.HUD = makeHud(); localStorage.clear();
        const p = makePanel(); p.root.style.left = "10px"; p.root.style.top = "10px";
        mouse("mousedown", 15, 15, p.root); ok(p.root.classList.contains("dragging")); mouse("mouseup", 0, 0);
        ok(!p.root.classList.contains("dragging")); eq(localStorage.getItem(KEY), null, "no localStorage write");
        eq(window.HUD.StoredData.layouts.default.elements[HUD_ID], undefined, "no HUD store write");
        ACEUIModLoader.panel.detach(p.panel); p.root.remove(); window.HUD = null;
    });

    t("panel: detach releases listeners and shows the root", function () {
        window.HUD = null; localStorage.clear();
        const p = makePanel(); p.root.style.left = "10px"; p.root.style.top = "10px";
        ACEUIModLoader.panel.detach(p.panel);
        eq(p.root.style.visibility, "", "shown");
        mouse("mousedown", 15, 15, p.root); mouse("mousemove", 500, 500); mouse("mouseup", 0, 0);
        eq(p.root.style.left, "10px", "listeners released"); eq(localStorage.getItem(KEY), null, "nothing saved");
        p.root.remove();
    });

    // ---- loop ----------------------------------------------------------------------------

    t("loop: start schedules frames before the callback, stop cancels", function () {
        const seen = [];
        const h = ACEUIModLoader.loop.start(function (now) { seen.push(now); if (now === 2) { throw new Error("frame error"); } });
        eq(clock.queue.length, 1, "first frame queued");
        clock.step(1); eq(seen.join(","), "1"); eq(clock.queue.length, 1, "next frame queued");
        try { clock.step(2); } catch (ignore) { /* the throw escapes the fake clock; the loop must survive */ }
        eq(clock.queue.length, 1, "loop survived a throwing frame");
        const cancelled = clock.cancelled;
        ACEUIModLoader.loop.stop(h);
        eq(clock.cancelled, cancelled + 1); eq(clock.queue.length, 0); eq(h.rafId, 0); eq(h.running, false);
        clock.step(3); eq(seen.length, 2, "no frames after stop");
    });

    t("loop: sampler commits at the fixed rate, catches up, resets after a stall", function () {
        const s = ACEUIModLoader.loop.sampler(50, 5000);   // 20 ms period, 5 s max gap
        let commits = 0; const commit = function () { commits += 1; };
        near(ACEUIModLoader.loop.advance(s, 1000, commit), 0, 1e-9, "first call starts the clock"); eq(commits, 0);
        near(ACEUIModLoader.loop.advance(s, 1010, commit), 0.5, 1e-9, "half way"); eq(commits, 0);
        near(ACEUIModLoader.loop.advance(s, 1020, commit), 0, 1e-9); eq(commits, 1, "one sample due");
        ACEUIModLoader.loop.advance(s, 1020 + 20 * 5, commit); eq(commits, 6, "catch up after a hitch");
        ACEUIModLoader.loop.advance(s, 1120 + 20000, commit); eq(commits, 6, "stall restarts the clock instead of replaying");
        ACEUIModLoader.loop.advance(s, 21120 + 20, commit); eq(commits, 7);
        ACEUIModLoader.loop.reset(s); eq(s.lastSampleAt, 0);
        near(ACEUIModLoader.loop.advance(s, 50000, commit), 0, 1e-9); eq(commits, 7, "reset: fresh start");
    });

    // ---- loader ---------------------------------------------------------------------------

    t("loader: constants, aliases, and it announced itself", function () {
        const L = ACEUIModLoader.loader;
        eq(L.ROOT, "ACEUIModLoaderMods/"); eq(ACEUIModLoader.ROOT, "ACEUIModLoaderMods/"); eq(L.MOD_FILE, "mod.json");
        eq(L.DEFAULT_PAGES.join(","), "hud.html");
        eq(L.PRESET_REQUEST, "SettingsRequestVideoPresetList"); eq(L.PRESET_RESPONSE, "SettingsResponseVideoPresetList");
        eq(L.MARKER_PREFIX, "ACEUIModLoaderMods-"); eq(L.MARKER_EXT, ".settingspreset");
        eq(ACEUIModLoader.ready, L.ready); eq(ACEUIModLoader.mods, L.mods); eq(typeof ACEUIModLoader.addScript, "function");
        ok(window.__log.some(function (l) { return l === "[ACEUIModLoader] loader " + ACEUIModLoader.VERSION + " on /harness.html"; }), "boot line");
    });

    t("loader: marker helpers and the file-name guard", function () {
        const L = ACEUIModLoader.loader;
        eq(L.markerNames(["ACEUIModLoaderMods-b", "Other", "ACEUIModLoaderMods-a", "ACEUIModLoaderMods-", 7]).join(","), "a,b");
        eq(L.markerNames(null).length, 0);
        const r = L.withoutMarkers({ __Type: "x", response: "OK", filenames: ["ACEUIModLoaderMods-a", "Mine"] });
        eq(r.filenames.join(","), "Mine"); eq(r.response, "OK"); eq(r.__Type, "x");
        eq(L.withoutMarkers(null), null);
        ["a.js", "pedal-graph.css", "mod.json"].forEach(function (f) { ok(L.isFileName(f), f); });
        ["sub/a.js", "sub\\a.js", "a", "", ".", "..", ".hidden", "a.", 5, null].forEach(function (f) { ok(!L.isFileName(f), JSON.stringify(f)); });
    });

    t("loader: it asked the game for the video preset list", function () {
        const sent = window.__engine.triggered.filter(function (x) { return x[0] === "OnUICommand" && x[1] === "SettingsRequestVideoPresetList"; });
        eq(sent.length, 1, "one request"); eq(sent[0][2].__Type, "SettingsRequestVideoPresetList"); eq(sent[0][2].version, 0);
        ok(ACEUIModLoader.loader.filtering(), "engine.on wrapped");
    });

    // Discovery finishes asynchronously (the fake engine answers on a timer, mod.json
    // fetches are XHRs), so the remaining cases wait for it before the report is written.
    const finish = function () {
        const loaderLines = window.__log.filter(function (l) { return l.indexOf("[ACEUIModLoader]") === 0 || l.indexOf("[Alpha]") === 0; });
        const statuses = ACEUIModLoader.loader.mods.map(function (m) { return m.name + "=" + m.status; }).join(" ");

        H.finish(["loader log: " + loaderLines.join(" | "), "mods: " + statuses, "errors: " + window.__warn.slice(-3).join(" | ")]);
    };
    const waitFor = function (cond, then, deadline) {
        if (cond() || Date.now() > deadline) { then(); return; }
        window.setTimeout(function () { waitFor(cond, then, deadline); }, 10);
    };

    // ACEUIModLoader.ready fires once every discovered mod has been processed (scripts loaded or skipped).
    // If it never does, report that as a failure instead of producing no report at all.
    let readyFired = false;
    window.setTimeout(function () {
        if (readyFired) { return; }
        t("loader: became ready", function () { throw new Error("ACEUIModLoader.ready never fired; mods: " + ACEUIModLoader.loader.mods.map(function (m) { return m.name + "=" + m.status; }).join(" ")); });
        finish();
    }, 5000);
    ACEUIModLoader.ready(function () {
        readyFired = true;
        t("loader: discovered the mods from the game's answer, not a manifest", function () {
            const mods = ACEUIModLoader.loader.mods;
            eq(ACEUIModLoader.loader.source(), "presets");
            eq(mods.map(function (m) { return m.name; }).join(","), "alpha,beta", "markers only, prefix stripped, sorted");
            eq(mods[0].status, "loaded", "alpha has a folder with mod.json in the harness");
            eq(mods[1].status, "missing", "beta has none");
            ok(window.__log.indexOf("[ACEUIModLoader] presets: 2 mod(s)") >= 0, "discovery line");
            ok(window.__log.indexOf("[ACEUIModLoader] mod alpha 1.2.3: loading 1 script(s), 0 stylesheet(s)") >= 0, "version from mod.json");
            ok(!window.__log.some(function (l) { return l.indexOf("nothing to load") >= 0; }), "no give-up line");
        });

        t("loader: the root is created inside the HUD container before the script runs, and mod() describes the mod", function () {
            const a = window.__alpha;
            ok(a, "alpha.js ran");
            eq(a.name, "alpha"); eq(a.title, "Alpha", "title from mod.json"); eq(a.version, "1.2.3"); eq(a.loaded, true);
            eq(a.base, "ACEUIModLoaderMods/alpha/");
            eq(a.hudId, "hud_alpha"); eq(a.storageKey, "acealpha.pos"); eq(a.filterKey, "acealpha.filters");
            ok(a.rootPresent, "root existed while the script ran"); eq(a.rootParent, "center", "inside .absolutecenter"); eq(a.rootAttr, "alpha");
            eq(document.querySelectorAll("#alpha").length, 1, "exactly one root");
            ok(window.__log.indexOf("[Alpha] alpha script ran") >= 0, "prefixed logger uses the title");
            const later = ACEUIModLoader.mod("alpha");
            eq(later.version, "1.2.3"); eq(later.root, document.getElementById("alpha"), "root by id later on");
            eq(ACEUIModLoader.mod, ACEUIModLoader.loader.mod, "alias");
            const dev = ACEUIModLoader.mod("zzz");
            eq(dev.version, ACEUIModLoader.loader.DEV_VERSION); eq(dev.loaded, false); eq(dev.base, ""); eq(dev.name, "zzz"); eq(dev.hudId, "hud_zzz");
            eq(ACEUIModLoader.mod("beta").version, "dev", "listed but not loaded reads as dev");
        });

        t("loader: mod(name).mount(attach) attaches once to #name when the DOM has it, and is a no-op otherwise", function () {
            let calls = [];
            const attach = function (root) { calls.push(root); };
            ACEUIModLoader.mod("gamma").mount(attach);
            eq(calls.length, 0, "no #gamma yet: nothing happens");
            const gamma = document.createElement("div"); gamma.id = "gamma"; center.appendChild(gamma);
            ACEUIModLoader.mod("gamma").mount(attach);
            eq(calls.length, 1, "attached once the root exists"); eq(calls[0], gamma, "with the root");
            ok(gamma.hasAttribute(ACEUIModLoader.loader.MOUNTED_ATTR), "marked as mounted");
            ACEUIModLoader.mod("gamma").mount(attach);
            eq(calls.length, 1, "a second mount is a no-op");
            gamma.remove();
        });

        // A stock-style handler registered through the wrapped engine.on must never see markers.
        let seen = null;
        const stockHandler = function (response) { seen = response; };
        const handle = engine.on("SettingsResponseVideoPresetList", stockHandler, { tag: "stock" });
        engine.trigger("OnUICommand", "SettingsRequestVideoPresetList", { __Type: "SettingsRequestVideoPresetList", version: 0 });

        t("drawer: builds a row per mod, parked off-screen behind a right-edge hot zone", function () {
            const panel = ACEUIModLoader.drawer.build([
                { name: "alpha", info: { title: "Alpha App" }, status: "loaded" },
                { name: "beta", info: { title: "Beta App" }, status: "failed" }
            ]);
            eq(panel.style.transform, "translateX(100%)", "starts closed, off the right edge");
            eq(panel.style.position, "fixed", "fixed to the screen, not the HUD layout");
            ok(ACEUIModLoader.drawer.state.hot, "hot zone created");
            eq(ACEUIModLoader.drawer.state.hot.style.right, "0px", "hot zone sits on the right edge");
            eq(ACEUIModLoader.drawer.state.apps.length, 2, "one app per mod");
            ok(panel.textContent.indexOf("Alpha App") >= 0, "uses the mod's title");
            ok(panel.textContent.indexOf("failed") >= 0, "a mod that did not load says so");
        });

        t("drawer: the hot zone opens it, leaving closes it after a delay", function () {
            const d = ACEUIModLoader.drawer;
            d.close();
            d.state.hot.dispatchEvent(new Event("mouseenter"));
            eq(d.state.open, true, "pointer at the edge opens it");
            ok(d.state.panel.style.transform.indexOf("translateX(0") === 0, "slid in");
            d.state.panel.dispatchEvent(new Event("mouseleave"));
            eq(d.state.open, true, "still open: the close is delayed, not instant");
            ok(d.state.closeTimer !== 0, "a close is pending");
            d.state.panel.dispatchEvent(new Event("mouseenter"));
            eq(d.state.closeTimer, 0, "coming back cancels the pending close");
            d.close();
            eq(d.state.panel.style.transform, "translateX(100%)", "closed again");
        });

        t("drawer: a switch hides the mod's own root element and remembers the choice", function () {
            const d = ACEUIModLoader.drawer;
            let root = document.getElementById("alpha");
            if (!root) {
                root = document.createElement("div");
                root.id = "alpha";
                document.getElementById("center").appendChild(root);
            }

            eq(d.isVisible("alpha"), true, "on by default");
            d.toggleApp("alpha");
            eq(d.isVisible("alpha"), false, "switched off");
            eq(root.style.display, "none", "the mod's root is hidden");
            eq(ACEUIModLoader.persist.readLocal(d.STORE_KEY).alpha, false, "and the choice is persisted");

            d.toggleApp("alpha");
            eq(root.style.display, "", "switched back on, the mod's own CSS decides again");
            eq(d.isVisible("alpha"), true);
        });

        t("drawer: a switched-off mod is hidden the instant its root is created, not when the drawer builds", function () {
            const d = ACEUIModLoader.drawer;
            /* The drawer builds on ready(), which fires only after EVERY mod has loaded, so
               anything that waits for build() leaves a switched-off app visible for that
               whole time -- about a second with a big mod in the queue, seen in game as the
               app flashing on and then vanishing again after a pause-menu reload. */
            d.setVisible("flashy", false);

            const root = document.createElement("div");
            root.id = "flashy";
            document.getElementById("center").appendChild(root);
            eq(root.style.display, "", "just created, nothing has hidden it yet");

            d.applyStored("flashy");
            eq(root.style.display, "none", "hidden immediately, without build() having run for it");

            d.setVisible("flashy", true);
            eq(root.style.display, "", "and switching it back on restores it");
            root.parentNode.removeChild(root);
        });

        t("drawer: switches survive a game restart, because they go to the HUD store too", function () {
            const d = ACEUIModLoader.drawer;
            const P = ACEUIModLoader.persist;
            window.HUD = makeHud({});     // the earlier panel cases leave it null
            /* localStorage dies with the game; the stock HUD layout container is the one
               the game writes to disk. Saving only to localStorage meant every app came
               back enabled after a restart. */
            d.setVisible("restarty", false);

            const local = P.readLocal(d.STORE_KEY);
            eq(local.restarty, false, "localStorage written (fast path for Escape/resume)");
            const hud = P.readHud(d.HUD_ID);
            ok(hud, "the HUD layout store took it as well");
            eq(hud.restarty, false, "and that is the copy that reaches disk");

            /* now act out a restart: localStorage gone, HUD store restored from disk */
            P.removeLocal(d.STORE_KEY);
            d.state.visible = {};
            d.state.touched = false;
            eq(d.isVisible("restarty"), true, "with nothing loaded it would default back to on");

            d.adoptHudStore(Date.now() + 1000);
            eq(d.isVisible("restarty"), false, "adopted from the HUD store");
            eq(P.readLocal(d.STORE_KEY).restarty, false, "and mirrored back so the next reload is instant");
            window.HUD = null;
        });

        t("drawer: a switch flipped before the HUD store arrives is not overwritten by it", function () {
            const d = ACEUIModLoader.drawer;
            d.setVisible("racy", false);          // user acts first
            d.state.touched = true;
            d.adoptHudStore(Date.now() + 1000);   // disk copy turns up afterwards
            eq(d.isVisible("racy"), false, "the newer choice wins over what was on disk");
        });

        t("drawer: switching a mod off stops it, not just hides it", function () {
            const d = ACEUIModLoader.drawer;
            /* Hiding the root left the mod's key handlers, frame loop and sounds running:
               DOOM still answered Insert and played music while "disabled". */
            const root = document.createElement("div");
            root.id = "lively";
            document.getElementById("center").appendChild(root);

            let attached = 0, detached = 0;
            const entry = { name: "lively", info: { title: "Lively" }, status: "loaded" };
            ACEUIModLoader.loader.mods.push(entry);
            entry.attach = function () { attached += 1; return { live: true }; };
            entry.detach = function () { detached += 1; };
            entry.instance = entry.attach(root);
            root.setAttribute("data-mounted", "");
            eq(attached, 1, "running to begin with");

            d.setVisible("lively", false);
            eq(detached, 1, "its own detach was called");
            eq(entry.instance, null, "and the instance released");
            eq(root.style.display, "none", "the root is hidden too");
            eq(root.hasAttribute("data-mounted"), false, "no longer marked mounted");

            d.setVisible("lively", true);
            eq(attached, 2, "switching back on restarts it");
            ok(entry.instance, "with a fresh instance");
            eq(root.style.display, "", "and visible again");

            root.parentNode.removeChild(root);
            ACEUIModLoader.loader.mods.splice(ACEUIModLoader.loader.mods.indexOf(entry), 1);
        });

        t("drawer: a mod that gave the loader no detach is still only hidden", function () {
            const d = ACEUIModLoader.drawer;
            const root = document.createElement("div");
            root.id = "stubborn";
            document.getElementById("center").appendChild(root);

            const entry = { name: "stubborn", info: {}, status: "loaded", instance: {} };
            ACEUIModLoader.loader.mods.push(entry);

            eq(ACEUIModLoader.loader.deactivate("stubborn"), false, "nothing to stop it with");
            d.setVisible("stubborn", false);
            eq(root.style.display, "none", "so hiding is all the drawer can do");

            root.parentNode.removeChild(root);
            ACEUIModLoader.loader.mods.splice(ACEUIModLoader.loader.mods.indexOf(entry), 1);
        });

        t("drawer: a mod's options pane is built lazily, only when it is first opened", function () {
            const d = ACEUIModLoader.drawer;
            let built = 0;
            d.registerOptions("alpha", function (pane) {
                built += 1;
                pane.appendChild(document.createTextNode("my options"));
            });
            const app = d.state.apps.filter(function (a) { return a.name === "alpha"; })[0];
            eq(app.gear.style.display, "", "registering reveals the gear");
            eq(built, 0, "nothing built until asked");

            app.gear.dispatchEvent(new MouseEvent("click", { bubbles: true }));
            eq(built, 1, "built on first open");
            eq(app.pane.style.display, "", "pane shown");
            ok(app.pane.textContent.indexOf("my options") >= 0, "the mod filled it");

            app.gear.dispatchEvent(new MouseEvent("click", { bubbles: true }));
            eq(app.pane.style.display, "none", "closes again");
            app.gear.dispatchEvent(new MouseEvent("click", { bubbles: true }));
            eq(built, 1, "and is not rebuilt on reopen");
        });

        t("drawer: a mod whose options throw does not take the drawer down", function () {
            const d = ACEUIModLoader.drawer;
            d.registerOptions("beta", function () { throw new Error("boom"); });
            const app = d.state.apps.filter(function (a) { return a.name === "beta"; })[0];
            app.gear.dispatchEvent(new MouseEvent("click", { bubbles: true }));
            ok(app.pane.textContent.indexOf("boom") >= 0, "the failure is shown in the pane");
            eq(d.state.apps.length, 2, "the rest of the drawer is intact");
        });

        waitFor(function () { return seen !== null; }, function () {
            t("loader: stock handlers get the list without our markers", function () {
                ok(seen, "stock handler ran");
                eq(seen.filenames.join(","), "MyLowSettings");
                eq(seen.response, "OK");
                eq(ACEUIModLoader.loader.mods.length, 2, "the loader's own handler was cleared after discovery");
                handle.clear();
                eq((window.__engine.handlers["SettingsResponseVideoPresetList"] || []).length, 0, "clear() still works through the wrapper");
            });
            finish();
        }, Date.now() + 2000);
    });
});
</script>
</body>
</html>
